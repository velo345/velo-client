<div class="launch-count fade-up" style="--d:.8s" data-launch="{{launch.date}}" role="timer" aria-live="off">
  <span class="lc-label" data-lc-label>Velo Client 1.0 leaves beta in</span>
  <span class="lc-units" data-lc-units><span><b data-lc="d">-</b>d</span><span><b data-lc="h">--</b>h</span><span><b data-lc="m">--</b>m</span><span><b data-lc="s">--</b>s</span></span>
  <span class="lc-note" data-lc-note>The beta is free to download right now.</span>
  <span class="lc-gift"><i class="coin-dot"></i>Launch week ({{launch.bonusWeek}}): new players get <b>{{launch.bonusCoins}} Velo Coins</b> free</span>
</div>
