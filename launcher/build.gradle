plugins {
	id 'application'
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
	mavenCentral()
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

javafx {
	version = "21.0.11"
	// javafx.swing pulls in SwingFXUtils, needed only to convert an ImageIO
	// BufferedImage (see RemoteIconLoader) into a javafx.scene.image.Image -
	// nothing here actually opens a Swing window.
	modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing']
}

application {
	mainClass = 'net.veloclient.launcher.LauncherApp'
	// webp-imageio (RemoteIconLoader) loads a native decoder via System.load()
	// - silences the JDK's restricted-native-access warning now, and avoids
	// it becoming a hard failure on a future JDK that blocks this by default.
	// The --add-* open JavaFX's window internals for NativeWindowDrag (the window manager moves/resizes the window on Linux).
	applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED', '--add-exports=javafx.graphics/com.sun.javafx.stage=ALL-UNNAMED',
			'--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED', '--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED', '-Xms48m', '-Xmx768m', '-XX:+UseG1GC', '-XX:G1PeriodicGCInterval=5000', '-XX:G1HeapRegionSize=1m',
			'-XX:ParallelGCThreads=2', '-XX:ConcGCThreads=1', '-XX:MinHeapFreeRatio=10', '-XX:MaxHeapFreeRatio=20', '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=64m', '-Xss512k', '-XX:+UseCompactObjectHeaders', '-Dprism.maxvram=512m']
}

dependencies {
	implementation 'com.google.code.gson:gson:2.11.0'
	// Modrinth's CDN serves almost all project icons as WebP - javafx.scene.image.Image
	// can't decode that format at all (silent load failure), so every one of
	// those icons fell back to the generic logo. This registers a WebP
	// ImageIO reader so RemoteIconLoader can decode them like any other
	// format. Pure ImageIO SPI plugin, no extra runtime setup needed beyond
	// being on the classpath.
	implementation 'org.sejda.imageio:webp-imageio:0.1.6'
}

test {
	useJUnitPlatform()
}

// Bundles each supported Minecraft version's built velo-client jar straight
// into the launcher's own resources, so it's a fully self-contained app that
// can always install the right jar into a profile's mods folder without
// needing the rest of this monorepo checked out alongside it.
def gameVersions = ["1.21.1", "1.21.10", "1.21.11", "26.1", "26.2", "26.3"]
// Dev build (./build-dev.sh / -PveloDev=true): bundles the dev client jars (with src/dev) and runs on its own data folder.
def veloDev = (findProperty("veloDev") ?: "false").toString().toBoolean()
// Resolved eagerly at configuration time (plain java.io.File, not a live
// Project reference) so the doLast below stays configuration-cache-safe.
def libsDirs = gameVersions.collectEntries { v -> [(v): rootProject.file("versions/${v}/build/libs")] }
def gameJarsResourceRoot = layout.buildDirectory.dir("generated/gamejars")
// 1.8.9 is its own Ornithe build (legacy/, own Gradle wrapper and Loom) - built here and bundled like the others.
def legacyDir = rootProject.file("legacy")
def legacyLibs = new File(legacyDir, "build/libs")
tasks.register("buildLegacyJar", Exec) {
	group = "build"
	description = "Builds the 1.8.9 velo-client jar (legacy/, Ornithe)."
	notCompatibleWithConfigurationCache("Runs a separate Gradle build")
	workingDir legacyDir
	commandLine(System.getProperty("os.name").toLowerCase().contains("win") ? ["cmd", "/c", "gradlew.bat", "build"] : ["./gradlew", "build"])
	inputs.dir(new File(legacyDir, "src"))
	inputs.files(new File(legacyDir, "build.gradle"), new File(legacyDir, "gradle.properties"))
	outputs.dir(legacyLibs)
}
def gameJarsOutputDir = gameJarsResourceRoot.map { it.dir("net/veloclient/launcher/gamejars") }

tasks.register("bundleGameJars") {
	group = "build"
	description = "Copies each supported Minecraft version's built velo-client jar into launcher resources."
	// Selects and copies a sibling project's build output after it builds -
	// not something the configuration cache can track precisely.
	notCompatibleWithConfigurationCache("Copies a sibling project's build output jar, resolved after that project builds")
	gameVersions.each { v -> dependsOn(":${v}:build") }
	dependsOn("buildLegacyJar")
	inputs.dir(legacyLibs)
	gameVersions.each { v ->
		inputs.files(fileTree(libsDirs[v]) { include "velo-client-*.jar", "velo-addons-*.jar"; exclude "*-sources.jar" })
	}
	// which flavour gets bundled is part of the output (dev and release jars sit side by side in libs/)
	inputs.property("dev", veloDev)
	outputs.dir(gameJarsOutputDir)
	doLast {
		def outDir = gameJarsOutputDir.get().asFile
		outDir.mkdirs()
		// never ship leftovers: an older build step put the private Velo+ Addons here (*-addons.jar) - they come from the
		// server only, and a tester launcher goes out to many people
		outDir.listFiles()?.each { if (it.name.endsWith("-addons.jar")) it.delete() }
		gameVersions.each { v ->
			def libsDir = libsDirs[v]
			def matches = libsDir.listFiles({ f -> f.name.startsWith("velo-client-") && f.name.endsWith(".jar") && !f.name.contains("-sources")
					&& f.name.contains("-dev+") == veloDev } as FileFilter)
			if (matches == null || matches.length == 0) {
				throw new GradleException("Expected a built velo-client jar for Minecraft ${v} in ${libsDir}, found none")
			}
			// After a version bump the previous version's jar is still lying around in libs/ -
			// the one just built (newest) is the right one.
			def newest = { File[] files -> files.max { it.lastModified() } }
			new File(outDir, "${v}.jar").bytes = newest(matches).bytes
		}
		def legacy = legacyLibs.listFiles({ f -> f.name.startsWith("velo-client-") && f.name.endsWith("+mc1.8.9.jar") } as FileFilter)
		if (legacy == null || legacy.length == 0) {
			throw new GradleException("Expected a built 1.8.9 velo-client jar in ${legacyLibs}, found none")
		}
		new File(outDir, "1.8.9.jar").bytes = legacy.max { it.lastModified() }.bytes
		// When these jars were bundled - the updater only treats a same-version release as a
		// hotfix if its jars were uploaded after this (jar bytes aren't reproducible across builds).
		new File(outDir, "build.properties").text = "builtAt=${System.currentTimeMillis()}\n"
	}
}

// Bundles a plain copy of the building JDK's own "java" launcher binary as an
// ordinary jar resource (net.veloclient.launcher.launch.JavaRuntimeFallback
// reads it back at runtime) - jpackage's bundled runtime doesn't reliably
// have this binary (see jpackageDist's comment for why patching it in at
// build/install time turned out to be a dead end), so the app carries its
// own spare copy and self-heals into a cache directory it's guaranteed to be
// able to write to, the first time it actually needs to launch Minecraft.
def javaRuntimeResourceRoot = layout.buildDirectory.dir("generated/javaruntime")

tasks.register("bundleJavaRuntimeFallback") {
	group = "build"
	description = "Bundles a spare copy of this JDK's own java binary as a launcher resource."
	def isWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("win")
	def binDir = new File(System.getProperty("java.home"), "bin")
	def sourceBinary = new File(binDir, isWindows ? "java.exe" : "java")
	// javaw.exe too: the game must run as javaw.exe for Discord to recognise Minecraft (game overlay, "Playing Minecraft").
	def windowedBinary = new File(binDir, "javaw.exe")
	def outDir = javaRuntimeResourceRoot.map { it.dir("net/veloclient/launcher/javaruntime") }
	inputs.file(sourceBinary)
	outputs.dir(outDir)
	doLast {
		def dir = outDir.get().asFile
		dir.mkdirs()
		new File(dir, sourceBinary.name).bytes = sourceBinary.bytes
		if (isWindows && windowedBinary.isFile()) {
			new File(dir, windowedBinary.name).bytes = windowedBinary.bytes
		}
	}
}

// This launcher's single source of truth for its own version - AppVersion.java
// reads it back as a classpath resource at runtime instead of independently
// hardcoded strings scattered across LauncherApp/GameLauncher. jpackageDist
// below reuses the same value for the native installer's version.
// -PlauncherVersion=1.2.4 (CI input) builds a test installer under another version, e.g. an update-test target.
def launcherAppVersion = (project.findProperty("launcherVersion") ?: "1.6.0").toString()
// A fixed identity for the Windows installer across every version - WiX
// needs this (--win-upgrade-uuid below) to recognize a new installer as an
// upgrade of whatever's already installed rather than an unrelated product,
// which is what was actually happening without it: running the installer
// for a newer version did nothing visible because Windows had no way to
// tell it apart from "already installed". MUST NEVER CHANGE, or every
// future version breaks upgrading again the exact same way.
def launcherWindowsUpgradeUuid = "2AC3F105-4C66-4B28-8ABE-B8FF7CCD58EF"
def launcherVersionResourceRoot = layout.buildDirectory.dir("generated/launcherversion")

tasks.register("writeLauncherVersion") {
	group = "build"
	description = "Writes launcherAppVersion into a version.properties resource for AppVersion to read at runtime."
	def outDir = launcherVersionResourceRoot.map { it.dir("net/veloclient/launcher") }
	inputs.property("version", launcherAppVersion)
	inputs.property("dev", veloDev)
	outputs.dir(outDir)
	doLast {
		def dir = outDir.get().asFile
		dir.mkdirs()
		new File(dir, "version.properties").text = "version=${launcherAppVersion}\ndev=${veloDev}\n"
	}
}

// The 3D wings (meshes, textures, previews and wings.json) from the mod's own assets, so the
// launcher's Store can show the same animated wings - one source of truth for both.
def wingAssetsResourceRoot = layout.buildDirectory.dir("generated/wings")

tasks.register("bundleWingAssets", Copy) {
	group = "build"
	description = "Copies the mod's 3D wing assets into launcher resources."
	from(rootProject.file("src/client/resources/assets/velo-client/cosmetics/wings"))
	from(rootProject.file("src/client/resources/assets/velo-client/textures/cosmetics/wings")) {
		into("textures")
	}
	into(wingAssetsResourceRoot.map { it.dir("net/veloclient/launcher/wings") })
}
// The auras' particle atlas, so the launcher draws the same feathers, petals, wings and ribbons as the game.
tasks.register("bundleAuraAtlas", Copy) {
	group = "build"
	description = "Copies the mod's aura texture atlas into launcher resources."
	from(rootProject.file("src/client/resources/assets/velo-client/textures/cosmetics/aura")) { include("atlas.png") }
	into(wingAssetsResourceRoot.map { it.dir("net/veloclient/launcher/aura") })
}

// The auras' animation code is plain Java shared with the mod: compiled into the launcher too, so its
// previews move exactly like the game's.
def auraSourceRoot = layout.buildDirectory.dir("generated/aura-src")
tasks.register("bundleAuraEffects", Copy) {
	group = "build"
	description = "Copies the mod's AuraEffects (plain Java) into launcher sources."
	from(rootProject.file("src/client/java/net/veloclient/velo/client/cosmetics/aura")) { include("AuraEffects.java") }
	into(auraSourceRoot.map { it.dir("net/veloclient/velo/client/cosmetics/aura") })
}
// The Store's kill effects too (plain Java, drawn with the auras' sprites).
tasks.register("bundleKillFxEffects", Copy) {
	group = "build"
	description = "Copies the mod's KillFxEffects (plain Java) into launcher sources."
	from(rootProject.file("src/client/java/net/veloclient/velo/client/cosmetics/killfx")) { include("KillFxEffects.java") }
	into(auraSourceRoot.map { it.dir("net/veloclient/velo/client/cosmetics/killfx") })
}
// Name Styles too (plain Java): the Locker's previews animate exactly like names in game.
tasks.register("bundleNameStyles", Copy) {
	group = "build"
	description = "Copies the mod's NameStyle + NameStyleEffects (plain Java) into launcher sources."
	from(rootProject.file("src/client/java/net/veloclient/velo/client/namestyle")) { include("NameStyle.java", "NameStyleEffects.java") }
	into(auraSourceRoot.map { it.dir("net/veloclient/velo/client/namestyle") })
}
tasks.register("bundleClipCore", Copy) {
	group = "build"
	description = "Copies the mod's clip player + FFmpeg tools (plain Java, clips/core) into launcher sources."
	from(rootProject.file("src/client/java/net/veloclient/velo/client/clips/core")) { include("*.java") }
	into(auraSourceRoot.map { it.dir("net/veloclient/velo/client/clips/core") })
}
// Custom cloak uploads (plain Java): the same cloak detection and picture-to-cloak conversion as the game.
tasks.register("bundleCapeArt", Copy) {
	group = "build"
	description = "Copies the mod's CapeArt (plain Java) into launcher sources."
	from(rootProject.file("src/client/java/net/veloclient/velo/client/cosmetics/capeart")) { include("CapeArt.java") }
	into(auraSourceRoot.map { it.dir("net/veloclient/velo/client/cosmetics/capeart") })
}
// Tentacle and clockwork rigs (plain Java), so the launcher's wings move like the game's.
tasks.register("bundleWingRigs", Copy) {
	group = "build"
	description = "Copies the mod's WingRigs (plain Java) into launcher sources."
	from(rootProject.file("src/client/java/net/veloclient/velo/client/cosmetics/wings")) { include("WingRigs.java") }
	into(auraSourceRoot.map { it.dir("net/veloclient/velo/client/cosmetics/wings") })
}
// Bodywear colours (plain Java): the same recolouring as the game.
tasks.register("bundleWearTint", Copy) {
	group = "build"
	description = "Copies the mod's WearTint (plain Java) into launcher sources."
	from(rootProject.file("src/client/java/net/veloclient/velo/client/cosmetics/wear")) { include("WearTint.java") }
	into(auraSourceRoot.map { it.dir("net/veloclient/velo/client/cosmetics/wear") })
}
tasks.named("compileJava") { dependsOn("bundleCapeArt", "bundleWingRigs", "bundleWearTint", "bundleAuraEffects", "bundleKillFxEffects", "bundleNameStyles", "bundleClipCore") }

sourceSets {
	main {
		java {
			srcDir(auraSourceRoot)
		}
		resources {
			srcDir(wingAssetsResourceRoot)
			srcDir(gameJarsResourceRoot)
			srcDir(javaRuntimeResourceRoot)
			srcDir(launcherVersionResourceRoot)
		}
	}
}

tasks.named("processResources") {
	dependsOn("bundleGameJars", "bundleJavaRuntimeFallback", "writeLauncherVersion", "bundleWingAssets", "bundleAuraAtlas")
}

// The javafx plugin's "run" task reaches into Project internals
// (Task.extensions/SourceSetContainer) at execution time to wire up JavaFX's
// module path, which Gradle 9's configuration cache can't serialize - without
// this, "./gradlew :launcher:run" fails outright unless you remember to pass
// --no-configuration-cache every time.
tasks.named("run") {
	notCompatibleWithConfigurationCache("org.openjfx.javafxplugin wires the module path via Task.extensions at execution time")
}

// (formerly used by the removed dev launcher script) writes the java command line for the built launcher (a java @argfile) so the dev launcher
// runs as its own process - started through "gradlew :launcher:run" it lived inside the Gradle daemon, which kept
// ~2.5 GB (-Xmx2G build JVM) next to the launcher for as long as it was open.
tasks.register("devRunArgs") {
	dependsOn("classes")
	notCompatibleWithConfigurationCache("reads the runtime classpath at execution time")
	def out = layout.buildDirectory.file("dev-run.args")
	doLast {
		def cp = project.sourceSets.main.runtimeClasspath
		def fx = cp.filter { it.name.startsWith("javafx-") }.asPath
		def rest = cp.filter { !it.name.startsWith("javafx-") }.asPath
		def q = { String a -> '"' + a.replace("\\", "\\\\").replace('"', '\\"') + '"' }
		def lines = ["--module-path", q(fx), "--add-modules", "javafx.controls,javafx.graphics,javafx.swing"]
		lines += project.application.applicationDefaultJvmArgs.collect { q(it.toString()) }
		lines += ["-cp", q(rest), project.application.mainClass.get()]
		out.get().asFile.text = lines.join("\n") + "\n"
	}
}

// Packages this app as a single native installer file for whoever's running
// this task's OS, via the JDK's own jpackage tool - no separate Java install
// needed by whoever downloads the result, since jpackage bundles a private
// copy of the JDK that ran it. jpackage cannot cross-compile (a Windows
// installer can only be built by running this ON Windows, etc.) - see
// .github/workflows/package-launcher.yml, which runs this task on a
// windows-latest/macos-latest/ubuntu-latest matrix to produce all three.
tasks.register("jpackageDist") {
	group = "distribution"
	description = "Builds a native installer for this OS (exe/msi on Windows, dmg on macOS, deb on Linux) via jpackage."
	notCompatibleWithConfigurationCache("Uses project.copy/project.exec at execution time to stage inputs and invoke jpackage")
	dependsOn(tasks.named("jar"))

	def stagingDir = layout.buildDirectory.dir("jpackage-input")
	def distDir = layout.buildDirectory.dir("jpackage-dist")
	def runtimeClasspath = configurations.runtimeClasspath
	def jarFile = tasks.named("jar").flatMap { it.archiveFile }
	def rootDir = rootProject.projectDir

	inputs.files(runtimeClasspath)
	inputs.file(jarFile)
	outputs.dir(distDir)

	doLast {
		def staging = stagingDir.get().asFile
		staging.deleteDir()
		staging.mkdirs()
		project.copy {
			from(runtimeClasspath)
			from(jarFile)
			into(staging)
		}

		def dist = distDir.get().asFile
		dist.deleteDir()
		dist.mkdirs()

		String osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
		boolean isWindows = osName.contains("win")
		boolean isMac = osName.contains("mac")
		String installerType = isWindows ? "exe" : (isMac ? "dmg" : "deb")
		// The tester flavour (-PveloDev=true): "Velo Client Tester" - its own app name, so it installs next to the normal
		// launcher (own folder, start menu entry, Windows product id), its own icon and file names.
		String logo = veloDev ? "Logo-dev" : "Logo"
		File iconFile = isWindows ? new File(rootDir, logo + ".ico") : (isMac ? new File(rootDir, logo + ".icns") : new File(rootDir, logo + ".png"))
		String appName = veloDev ? "Velo Client Tester" : "Velo Client Launcher"
		String filePrefix = veloDev ? "velo-client-tester" : "velo-client-launcher"
		// installers take at most three numbers; tester builds are 1.5.1.4 - the full one lives in version.properties
		String packageVersion = launcherAppVersion.tokenize('.').take(3).join('.')
		// jpackage bundles whatever JDK is running it - use that same JDK's own
		// jpackage binary explicitly rather than "jpackage" off PATH, since a
		// machine can have several JDKs installed with PATH pointing elsewhere
		// (that's the case on the box this was developed on).
		String jpackageBin = new File(new File(System.getProperty("java.home"), "bin"), isWindows ? "jpackage.exe" : "jpackage").absolutePath

		// Deliberately NOT touching the bundled runtime's bin/ here (no
		// --jlink-options override, no post-build patching of the app-image)
		// after two different ways of doing that both broke the Windows
		// installer itself (crashed immediately instead of installing, for
		// reasons that didn't show up in jpackage's own output) - this is
		// exactly jpackage's own untouched default recipe, which is known to
		// produce an installer that actually installs. GameLauncher handles
		// the resulting missing "java" binary itself at first run instead
		// (see JavaRuntimeFallback) rather than this task fighting jpackage/
		// WiX over it.
		List<String> command = [
				jpackageBin,
				"--type", installerType,
				"--input", staging.absolutePath,
				"--dest", dist.absolutePath,
				"--name", appName,
				"--app-version", packageVersion,
				"--vendor", "Velo Client",
				"--description", "Launch Minecraft with your Velo Client mod profiles",
				"--main-jar", jarFile.get().asFile.name,
				"--main-class", "net.veloclient.launcher.LauncherApp",
				"--icon", iconFile.absolutePath,
				// Without this, jpackage runs jdeps against only the
				// launcher's *own* classpath (JavaFX/our own GUI code) to
				// decide which JDK modules to bundle into the runtime image
				// - and GameLauncher runs the actual downloaded Minecraft
				// jars under this exact same bundled runtime (java.home),
				// not a separate JDK. That trimmed image is missing modules
				// Minecraft itself needs but the launcher's own code never
				// touches - confirmed in a real crash log: vanilla's own DNS
				// SRV redirect resolver needs jdk.naming.dns
				// (com.sun.jndi.dns.DnsContextFactory), which jdeps has no
				// way to see coming since it's loaded by fully-qualified
				// class name at runtime, not a static reference. There's no
				// way to enumerate everything an arbitrary downloaded
				// Minecraft/Fabric version might need, so bundle the whole
				// JDK's module set instead of guessing - this is jpackage's
				// own supported flag for that (unlike the two approaches
				// referenced above, it doesn't touch the runtime after the
				// fact or fight jpackage's own build).
				"--add-modules", "ALL-MODULE-PATH",
				// The app runs off the classpath (--main-jar/--main-class, no
				// module-info), but JavaFX's own launch check still requires
				// javafx.controls/javafx.graphics to be resolvable as modules -
				// $APPDIR is a jpackage placeholder resolved at install time to
				// wherever it puts --input's contents (where the javafx-*.jar
				// files already are), not a literal env var.
				"--java-options", "--module-path=\$APPDIR",
				"--java-options", "--add-modules=javafx.controls,javafx.graphics,javafx.swing",
				"--java-options", "--enable-native-access=ALL-UNNAMED",
				// JavaFX's window internals for NativeWindowDrag (the window manager moves/resizes the window on Linux)
				"--java-options", "--add-exports=javafx.graphics/com.sun.javafx.stage=ALL-UNNAMED",
				"--java-options", "--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED",
				"--java-options", "--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED",
				// Memory: capped heap, and G1 with a periodic collection every 5 s that hands unused heap back to the OS
				// concurrently. Measured 2026-11-03 (whole-launcher tour, warm cache): SerialGC sat at 830-1150 MB and
				// only shrank after a full GC; G1 like this 620-790 MB, peak 830 instead of 1177. Few GC threads - a UI
				// doesn't need more. C1-only JIT keeps compiler memory/threads down; a UI doesn't need C2.
				"--java-options", "-Xms48m",
				"--java-options", "-Xmx768m",
				"--java-options", "-XX:+UseG1GC",
				"--java-options", "-XX:G1PeriodicGCInterval=5000",
				"--java-options", "-XX:G1HeapRegionSize=1m",
				"--java-options", "-XX:ParallelGCThreads=2",
				"--java-options", "-XX:ConcGCThreads=1",
				"--java-options", "-XX:MinHeapFreeRatio=10",
				"--java-options", "-XX:MaxHeapFreeRatio=20",
				"--java-options", "-XX:TieredStopAtLevel=1",
				"--java-options", "-XX:ReservedCodeCacheSize=64m",
				"--java-options", "-Xss512k",
				// Java 25: 8-byte object headers instead of 12 - every object smaller, ~10-20% less heap for the same UI.
				"--java-options", "-XX:+UseCompactObjectHeaders",
				"--java-options", "-Dprism.maxvram=512m"
		]
		// The installer-free update (launch/AppUpdate.java): the app folder's files + a small manifest, as
		// velo-client-launcher-<version>-app-<platform>.zip. Launchers that already run this version's runtime just
		// unpack it into their user folder and start from there - no installer, no admin rights, no password prompt.
		String cpu = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
		String platform = isWindows ? "windows-x64" : isMac ? "macos-" + (cpu.contains("aarch64") || cpu.contains("arm") ? "arm64" : "x64") : "linux-x64"
		// this version's own JVM options ($APPDIR = the folder it's unpacked to), read back by AppUpdate.hop
		List<String> javaOptions = []
		for (int i = 0; i < command.size() - 1; i++) {
			if (command[i] == "--java-options") {
				javaOptions << command[i + 1]
			}
		}
		File appZip = new File(dist, "${filePrefix}-${launcherAppVersion}-app-${platform}.zip")
		new java.util.zip.ZipOutputStream(new FileOutputStream(appZip)).withCloseable { zip ->
			zip.setLevel(1)
			String manifest = groovy.json.JsonOutput.toJson([version: launcherAppVersion, platform: platform,
					javaFeature: Runtime.version().feature(), files: staging.listFiles().collect { it.name }.sort(),
					javaOptions: javaOptions])
			zip.putNextEntry(new java.util.zip.ZipEntry("velo-launcher-app.json"))
			zip.write(manifest.getBytes("UTF-8"))
			zip.closeEntry()
			staging.listFiles().sort { it.name }.each { File f ->
				zip.putNextEntry(new java.util.zip.ZipEntry(f.name))
				f.withInputStream { zip << it }
				zip.closeEntry()
			}
		}
		if (isWindows) {
			command += ["--win-shortcut", "--win-menu", "--win-dir-chooser", "--win-upgrade-uuid", launcherWindowsUpgradeUuid]
		}
		if (isMac) {
			command += ["--mac-package-identifier", veloDev ? "net.veloclient.tester" : "net.veloclient.launcher", "--mac-package-name", veloDev ? "Velo Tester" : "Velo Client"]
		}
		List<String> appImage = new ArrayList<>(command)
		if (!isWindows && !isMac) {
			command += ["--linux-shortcut"]
		}
		if (isMac) {
			buildMacDmg(appImage, dist, launcherAppVersion, packageVersion, appName, filePrefix, veloDev)
			return
		}
		runJpackage(command)
		if (!isWindows && !isMac) {
			relaxDebDependencies(dist)
		}
		if (isWindows && !veloDev) {
			buildInnoSetup(appImage, dist, launcherAppVersion, packageVersion, appName, rootDir)
		}
		// Linux without dpkg (Arch, Fedora, ...): the same app as a plain folder with its runtime, packed as
		// velo-client-launcher-<version>-linux-x64.tar.gz - what packaging/aur/PKGBUILD installs to /opt.
		if (!isWindows && !isMac) {
			File imageDir = new File(dist, "app-image")
			int type = appImage.indexOf("--type")
			appImage.set(type + 1, "app-image")
			appImage.set(appImage.indexOf("--dest") + 1, imageDir.absolutePath)
			runJpackage(appImage)
			File app = new File(imageDir, appName)
			File renamed = new File(imageDir, filePrefix)
			if (!app.renameTo(renamed)) {
				throw new GradleException("jpackage app-image not found at " + app)
			}
			String tarName = "${filePrefix}-${launcherAppVersion}-linux-x64.tar.gz"
			Process tar = new ProcessBuilder("tar", "-czf", new File(dist, tarName).absolutePath, "-C", imageDir.absolutePath, filePrefix)
					.redirectErrorStream(true).start()
			String tarOut = tar.inputStream.getText("UTF-8")
			if (tar.waitFor() != 0) {
				throw new GradleException("tar failed: " + tarOut)
			}
			imageDir.deleteDir()
		}
	}
}

// jpackage writes down the build machine's package names: built on Ubuntu 24.04 the .deb asks for libasound2t64, which
// Mint 21, Ubuntu 22.04 and Debian 12 don't have (there it is libasound2), so it refused to install. Either one will do.
void relaxDebDependencies(File dist) {
	def run = { List<String> cmd ->
		Process p = new ProcessBuilder(cmd).redirectErrorStream(true).start()
		String out = p.inputStream.getText("UTF-8")
		if (p.waitFor() != 0) {
			throw new GradleException(cmd.join(" ") + " failed: " + out)
		}
	}
	(dist.listFiles() ?: []).findAll { it.name.endsWith(".deb") }.each { File deb ->
		File tree = new File(dist, "deb-tree")
		tree.deleteDir()
		run(["dpkg-deb", "-R", deb.absolutePath, tree.absolutePath])
		File control = new File(tree, "DEBIAN/control")
		String text = control.getText("UTF-8")
		String fixed = text.replaceAll(/libasound2t64(?!\s*\|)/, "libasound2t64 | libasound2")
		if (fixed != text) {
			control.setText(fixed, "UTF-8")
			run(["dpkg-deb", "--root-owner-group", "-Zzstd", "-b", tree.absolutePath, deb.absolutePath])
		}
		tree.deleteDir()
	}
}

// Windows: "Velo-Client-Setup-<version>.exe" - the branded installer for new players (packaging/windows/velo-setup.iss,
// Inno Setup 6.6+ for its dark wizard; built with the plain modern one on an older Inno). Per-user, no admin prompt.
// Built from jpackage's app image of the same files. Skipped (with a note) where Inno Setup isn't installed - the
// jpackage .exe is built either way, the updater's fallback keeps using that one for its installs.
void buildInnoSetup(List<String> appImageCommand, File dist, String version, String packageVersion, String appName, File rootDir) {
	File iscc = [System.getenv("INNO_ISCC"), "C:/Program Files (x86)/Inno Setup 6/ISCC.exe", "C:/Program Files/Inno Setup 6/ISCC.exe"]
			.findAll { it != null }.collect { new File(it) }.find { it.isFile() }
	if (iscc == null) {
		println("Inno Setup not found - skipping Velo-Client-Setup.exe")
		return
	}
	File imageDir = new File(dist, "inno-image")
	List<String> image = new ArrayList<>()
	// app-image takes none of the installer options
	for (int i = 0; i < appImageCommand.size(); i++) {
		String a = appImageCommand[i]
		if (a == "--win-upgrade-uuid") {
			i++
			continue
		}
		if (a.startsWith("--win-")) {
			continue
		}
		image << a
	}
	image.set(image.indexOf("--type") + 1, "app-image")
	image.set(image.indexOf("--dest") + 1, imageDir.absolutePath)
	runJpackage(image)
	File app = new File(imageDir, appName)
	if (!app.isDirectory()) {
		throw new GradleException("jpackage app-image not found at " + app)
	}
	String template = new File(rootDir, "packaging/windows/velo-setup.iss").getText("UTF-8")
	String numeric = (packageVersion.tokenize(".") + ["0", "0", "0"]).take(4).join(".")
	for (String style : ["modern dark", "modern"]) {
		String iss = template
				.replace("@APP_NAME@", "Velo Client")
				.replace("@VERSION@", version)
				.replace("@NUMERIC_VERSION@", numeric)
				.replace("@EXE_NAME@", appName + ".exe")
				.replace("@APP_ID@", "6C1E9B4A-2D7F-4F3B-9A61-7E0C5B8D4A21}")
				.replace("@OUTPUT_DIR@", dist.absolutePath)
				.replace("@OUTPUT_NAME@", "Velo-Client-Setup-" + version)
				.replace("@ICON@", new File(rootDir, "Logo.ico").absolutePath)
				.replace("@IMAGES@", new File(rootDir, "packaging/windows").absolutePath)
				.replace("@SOURCE_DIR@", app.absolutePath)
				.replace("@STYLE@", style)
		File script = new File(dist, "velo-setup.generated.iss")
		script.setText(iss, "UTF-8")
		Process p = new ProcessBuilder(iscc.absolutePath, "/Q", script.absolutePath).redirectErrorStream(true).start()
		String out = p.inputStream.getText("UTF-8")
		if (p.waitFor() == 0) {
			println("Built Velo-Client-Setup-" + version + ".exe (" + style + ")")
			script.delete()
			imageDir.deleteDir()
			return
		}
		println("Inno Setup failed with WizardStyle=" + style + ": " + out)
	}
	// never fails the build: the jpackage installer and the app zips (what updates use) are what a release needs
	println("WARNING: Inno Setup couldn't build Velo-Client-Setup - releasing without it")
	imageDir.deleteDir()
}

// macOS: one .dmg per CPU, built on that CPU's runner (jpackage bundles the JDK that runs it, so an
// arm64 JDK gives an Apple Silicon app and an x64 JDK an Intel one - see .github/workflows/package-launcher.yml).
// The app is built as an app-image first and signed ad hoc over the whole bundle (no Apple developer
// certificate yet): Apple Silicon refuses to run unsigned code at all, and an ad-hoc signature that
// covers every nested binary keeps the bundle's seal consistent, so Gatekeeper shows its normal
// "unidentified developer" prompt (right-click > Open, or Open Anyway in Privacy & Security) instead
// of "is damaged and can't be opened". Then the dmg is packed from that signed image and named
// velo-client-launcher-<version>-macos-<arm64|x64>.dmg - UpdateService picks the asset by that suffix.
void buildMacDmg(List<String> appImageCommand, File dist, String version, String packageVersion, String appName, String filePrefix, boolean tester) {
	String arch = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
	String archSuffix = arch.contains("aarch64") || arch.contains("arm") ? "arm64" : "x64"
	File imageDir = new File(dist, "app-image")
	List<String> image = new ArrayList<>(appImageCommand)
	image.set(image.indexOf("--type") + 1, "app-image")
	image.set(image.indexOf("--dest") + 1, imageDir.absolutePath)
	runJpackage(image)
	File app = new File(imageDir, appName + ".app")
	if (!app.isDirectory()) {
		throw new GradleException("jpackage app-image not found at " + app)
	}
	runTool(["xattr", "-cr", app.absolutePath])
	runTool(["codesign", "--force", "--deep", "--sign", "-", "--timestamp=none", app.absolutePath])
	runTool(["codesign", "--verify", "--deep", "--strict", app.absolutePath])
	String jpackageBin = new File(new File(System.getProperty("java.home"), "bin"), "jpackage").absolutePath
	runJpackage([jpackageBin, "--type", "dmg", "--app-image", app.absolutePath, "--dest", dist.absolutePath,
			"--name", appName, "--app-version", packageVersion, "--vendor", "Velo Client",
			"--mac-package-identifier", tester ? "net.veloclient.tester" : "net.veloclient.launcher"])
	File dmg = dist.listFiles().find { it.name.endsWith(".dmg") }
	if (dmg == null) {
		throw new GradleException("jpackage produced no .dmg in " + dist)
	}
	File renamed = new File(dist, "${filePrefix}-${version}-macos-${archSuffix}.dmg")
	if (!dmg.renameTo(renamed)) {
		throw new GradleException("Couldn't rename " + dmg + " to " + renamed)
	}
	imageDir.deleteDir()
}

void runTool(List<String> command) {
	Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
	String output = process.inputStream.getText("UTF-8")
	if (process.waitFor() != 0) {
		throw new GradleException(command[0] + " failed:\n" + output)
	}
}

// Plain ProcessBuilder rather than Gradle's own exec APIs - Project.exec()
// was removed in Gradle 9 and its replacement (injected ExecOperations) needs
// a proper task class to receive via constructor injection, which is more
// ceremony than this ad-hoc task warrants.
//
// Deliberately not inheritIO(): with the Gradle daemon (the default),
// "inherited" file descriptors are the daemon's own, not this build
// invocation's console, so a failing jpackage's actual error message never
// reaches the terminal at all - capture and print it explicitly instead, and
// fold it into the exception so it survives even -q.
void runJpackage(List<String> command) {
	Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
	String output = process.inputStream.getText("UTF-8")
	int exitCode = process.waitFor()
	println(output)
	if (exitCode != 0) {
		throw new GradleException("jpackage exited with code ${exitCode}:\n${output}")
	}
}

// Dev: exports every aura's Store-card animation as PNG frames (see ui/AuraPreviewExport and
// tools/cosmetics/export_aura_previews.sh, which turns them into animated WebP for the website and the owner panel).
tasks.register("auraPreviews", JavaExec) {
	group = "velo"
	description = "Renders aura preview frames with the launcher's own aura renderer."
	dependsOn("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "net.veloclient.launcher.ui.AuraPreviewExport"
	args = [project.findProperty("auraOut") ?: layout.buildDirectory.dir("aura-previews").get().asFile.path, "300", "72"]
	// -PauraOnly=id,id renders just those.
	if (project.findProperty("auraOnly")) {
		args += [project.findProperty("auraOnly").toString()]
	}
	doFirst {
		def fx = sourceSets.main.runtimeClasspath.filter { it.name.startsWith("javafx-") }
		jvmArgs = ["--module-path", fx.asPath, "--add-modules", "javafx.controls,javafx.graphics,javafx.swing"]
	}
}
