plugins {
	id 'application'
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
	mavenCentral()
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

javafx {
	version = "21.0.11"
	modules = ['javafx.controls', 'javafx.graphics']
}

application {
	mainClass = 'net.veloclient.launcher.LauncherApp'
}

dependencies {
	implementation 'com.google.code.gson:gson:2.11.0'
}

test {
	useJUnitPlatform()
}

// Bundles each supported Minecraft version's built velo-client jar straight
// into the launcher's own resources, so it's a fully self-contained app that
// can always install the right jar into a profile's mods folder without
// needing the rest of this monorepo checked out alongside it.
def gameVersions = ["1.21.11", "26.1", "26.2"]
// Resolved eagerly at configuration time (plain java.io.File, not a live
// Project reference) so the doLast below stays configuration-cache-safe.
def libsDirs = gameVersions.collectEntries { v -> [(v): rootProject.file("versions/${v}/build/libs")] }
def gameJarsResourceRoot = layout.buildDirectory.dir("generated/gamejars")
def gameJarsOutputDir = gameJarsResourceRoot.map { it.dir("net/veloclient/launcher/gamejars") }

tasks.register("bundleGameJars") {
	group = "build"
	description = "Copies each supported Minecraft version's built velo-client jar into launcher resources."
	// Selects and copies a sibling project's build output after it builds -
	// not something the configuration cache can track precisely.
	notCompatibleWithConfigurationCache("Copies a sibling project's build output jar, resolved after that project builds")
	gameVersions.each { v -> dependsOn(":${v}:build") }
	gameVersions.each { v ->
		inputs.files(fileTree(libsDirs[v]) { include "velo-client-*.jar"; exclude "*-sources.jar" })
	}
	outputs.dir(gameJarsOutputDir)
	doLast {
		def outDir = gameJarsOutputDir.get().asFile
		outDir.mkdirs()
		gameVersions.each { v ->
			def libsDir = libsDirs[v]
			def matches = libsDir.listFiles({ f -> f.name.startsWith("velo-client-") && f.name.endsWith(".jar") && !f.name.contains("-sources") } as FileFilter)
			if (matches == null || matches.length != 1) {
				throw new GradleException("Expected exactly one built velo-client jar for Minecraft ${v} in ${libsDir}, found ${matches == null ? 0 : matches.length}")
			}
			new File(outDir, "${v}.jar").bytes = matches[0].bytes
		}
	}
}

sourceSets {
	main {
		resources {
			srcDir(gameJarsResourceRoot)
		}
	}
}

tasks.named("processResources") {
	dependsOn("bundleGameJars")
}

// The javafx plugin's "run" task reaches into Project internals
// (Task.extensions/SourceSetContainer) at execution time to wire up JavaFX's
// module path, which Gradle 9's configuration cache can't serialize - without
// this, "./gradlew :launcher:run" fails outright unless you remember to pass
// --no-configuration-cache every time.
tasks.named("run") {
	notCompatibleWithConfigurationCache("org.openjfx.javafxplugin wires the module path via Task.extensions at execution time")
}

// Packages this app as a single native installer file for whoever's running
// this task's OS, via the JDK's own jpackage tool - no separate Java install
// needed by whoever downloads the result, since jpackage bundles a private
// copy of the JDK that ran it. jpackage cannot cross-compile (a Windows
// installer can only be built by running this ON Windows, etc.) - see
// .github/workflows/package-launcher.yml, which runs this task on a
// windows-latest/macos-latest/ubuntu-latest matrix to produce all three.
def launcherAppVersion = "0.2.0"

tasks.register("jpackageDist") {
	group = "distribution"
	description = "Builds a native installer for this OS (exe/msi on Windows, dmg on macOS, deb on Linux) via jpackage."
	notCompatibleWithConfigurationCache("Uses project.copy/project.exec at execution time to stage inputs and invoke jpackage")
	dependsOn(tasks.named("jar"))

	def stagingDir = layout.buildDirectory.dir("jpackage-input")
	def distDir = layout.buildDirectory.dir("jpackage-dist")
	def runtimeClasspath = configurations.runtimeClasspath
	def jarFile = tasks.named("jar").flatMap { it.archiveFile }
	def rootDir = rootProject.projectDir

	inputs.files(runtimeClasspath)
	inputs.file(jarFile)
	outputs.dir(distDir)

	doLast {
		def staging = stagingDir.get().asFile
		staging.deleteDir()
		staging.mkdirs()
		project.copy {
			from(runtimeClasspath)
			from(jarFile)
			into(staging)
		}

		def dist = distDir.get().asFile
		dist.deleteDir()
		dist.mkdirs()

		String osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
		boolean isWindows = osName.contains("win")
		boolean isMac = osName.contains("mac")
		String installerType = isWindows ? "exe" : (isMac ? "dmg" : "deb")
		File iconFile = isWindows ? new File(rootDir, "Logo.ico") : (isMac ? new File(rootDir, "Logo.icns") : new File(rootDir, "Logo.png"))
		// jpackage bundles whatever JDK is running it - use that same JDK's own
		// jpackage binary explicitly rather than "jpackage" off PATH, since a
		// machine can have several JDKs installed with PATH pointing elsewhere
		// (that's the case on the box this was developed on).
		String jpackageBin = new File(new File(System.getProperty("java.home"), "bin"), isWindows ? "jpackage.exe" : "jpackage").absolutePath

		List<String> command = [
				jpackageBin,
				"--type", installerType,
				"--input", staging.absolutePath,
				"--dest", dist.absolutePath,
				"--name", "Velo Client Launcher",
				"--app-version", launcherAppVersion,
				"--vendor", "Velo Client",
				"--description", "Launch Minecraft with your Velo Client mod profiles",
				"--main-jar", jarFile.get().asFile.name,
				"--main-class", "net.veloclient.launcher.LauncherApp",
				"--icon", iconFile.absolutePath,
				// The app runs off the classpath (--main-jar/--main-class, no
				// module-info), but JavaFX's own launch check still requires
				// javafx.controls/javafx.graphics to be resolvable as modules -
				// $APPDIR is a jpackage placeholder resolved at install time to
				// wherever it puts --input's contents (where the javafx-*.jar
				// files already are), not a literal env var.
				"--java-options", "--module-path=\$APPDIR",
				"--java-options", "--add-modules=javafx.controls,javafx.graphics"
		]
		if (isWindows) {
			command += ["--win-shortcut", "--win-menu", "--win-dir-chooser"]
		}
		// Plain ProcessBuilder rather than Gradle's own exec APIs - Project.exec()
		// was removed in Gradle 9 and its replacement (injected ExecOperations)
		// needs a proper task class to receive via constructor injection, which
		// is more ceremony than this ad-hoc task warrants.
		Process process = new ProcessBuilder(command).inheritIO().start()
		int exitCode = process.waitFor()
		if (exitCode != 0) {
			throw new GradleException("jpackage exited with code ${exitCode}")
		}
	}
}
