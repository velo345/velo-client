# Gradle-level options only - Fabric/mod version config now lives in
# stonecutter.properties.toml (see the Stonecutter multi-version migration).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# maven.kikugie.dev (Stonecutter's plugins) can take 20-30 s per request - Gradle's default 30 s
# timeout then fails CI builds with "plugin was not found". Wait longer and retry more.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
