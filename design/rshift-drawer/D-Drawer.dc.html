<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R-Shift concept D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#ddd}
.glass-row:hover{background:rgba(255,255,255,.07)}
.glass-icon:hover{background:rgba(255,255,255,.16)}
</style>
</helmet>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:Geist,system-ui,sans-serif;color:#fff">
<img src="/_blob/2c13934c10ac325461171bc36aad2ab0" alt="The game world, still visible behind the menu" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.8)">

<div aria-hidden="true" style="position:absolute;left:16px;top:14px;font-family:'Geist Mono',monospace;font-size:14px;text-shadow:0 1px 2px #000">512 FPS</div>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" style="position:absolute;left:509px;top:349px"><path d="M11 3v6M11 13v6M3 11h6M13 11h6" stroke="#fff" stroke-width="2"></path></svg>

<aside aria-label="Velo menu" style="position:absolute;right:16px;top:16px;bottom:16px;width:360px;box-sizing:border-box;padding:18px;display:flex;flex-direction:column;gap:14px;background:rgba(18,18,20,.55);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)">
<div style="display:flex;align-items:center;gap:10px">
<span aria-hidden="true" style="width:8px;height:8px;border-radius:2px;background:#E5373E"></span>
<span style="font-weight:700;font-size:18px;letter-spacing:-.2px">Velo</span>
<div style="flex:1"></div>
<button aria-label="Profile: PvP" style="height:30px;padding:0 12px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font:inherit;font-size:12px;font-weight:500;cursor:pointer">PvP</button>
<button aria-label="Close" style="width:30px;height:30px;border-radius:15px;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<label style="display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
<input placeholder="Search 182 modules" aria-label="Search modules" style="flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:14px">
</label>

<button style="height:44px;border-radius:22px;border:0;background:#fff;color:#111;font:inherit;font-size:14px;font-weight:600;cursor:pointer">Edit HUD</button>

<div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px">
<div style="font-size:12px;color:rgba(255,255,255,.6);margin:4px 6px 4px">Pinned</div>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
<div class="glass-row" style="height:44px;display:flex;align-items:center;gap:12px;padding:0 6px 0 10px;border-radius:12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:.9"><path d="{{p.icon}}"></path></svg>
<span style="flex:1;font-size:14px;font-weight:500">{{p.name}}</span>
<button aria-pressed="{{p.pressed}}" onClick="{{p.toggle}}" style="{{p.pill}}">{{p.state}}</button>
</div>
</sc-for>
<div style="height:1px;background:rgba(255,255,255,.1);margin:8px 6px"></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<button class="glass-row" style="height:40px;display:flex;align-items:center;gap:12px;padding:0 10px;border:0;border-radius:12px;background:transparent;color:#fff;font:inherit;cursor:pointer;text-align:left">
<span style="flex:1;font-size:14px">{{g.name}}</span>
<span style="font-family:'Geist Mono',monospace;font-size:12px;color:rgba(255,255,255,.55)">{{g.count}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>

<nav aria-label="More" style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)">
<sc-for list="{{dock}}" as="d" hint-placeholder-count="5">
<button class="glass-icon" aria-label="{{d.label}}" title="{{d.label}}" style="width:52px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></button>
</sc-for>
</nav>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { on: { sprint: true, bright: false, zoom: true, fps: true } };
  }
  renderVals() {
    const on = this.state.on;
    const pin = (id, name, icon) => {
      const a = !!on[id];
      return { name, icon, state: a ? 'On' : 'Off', pressed: a ? 'true' : 'false',
        toggle: () => this.setState({ on: { ...on, [id]: !a } }),
        pill: 'width:52px;height:28px;border-radius:14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;'
          + (a ? 'border:0;background:#fff;color:#111' : 'border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.8)') };
    };
    return {
      pins: [pin('fps', 'FPS Counter', 'M4 18h16M6 14l4-4 3 3 5-6'), pin('sprint', 'Toggle Sprint', 'M5 12h10M11 6l6 6-6 6'),
        pin('zoom', 'Zoom', 'M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-6-6'), pin('bright', 'Full Bright', 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M2 12h2M20 12h2')],
      groups: [{ name: 'HUD', count: 33 }, { name: 'PvP', count: 29 }, { name: 'Visuals', count: 28 }, { name: 'Utility', count: 35 }, { name: 'Performance', count: 17 }, { name: 'Advanced', count: 19 }],
      dock: [{ label: 'Locker', icon: 'M8 4l4 2 4-2 4 3-2 4h-2v9H8v-9H6L4 7z' }, { label: 'Friends', icon: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3 3-5 6-5s6 2 6 5' },
        { label: 'Clips & Rewind', icon: 'M4 5h16v14H4zM10 9l5 3-5 3z' }, { label: 'World Map', icon: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14' },
        { label: 'Settings', icon: 'M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4' }]
    };
  }
}
</script>
</body>
</html>
