<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R-Shift concept A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,700&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0A}
a{color:#FF6B6F}a:hover{color:#ff8a8d}
.velo-tile:hover{background:#1E191A}
.velo-chip:hover{color:#F2ECEB}
.velo-rail-btn:hover{background:#1E191A;color:#F2ECEB}
</style>
</helmet>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#F2ECEB">
<img src="/_blob/2c13934c10ac325461171bc36aad2ab0" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px) brightness(.55);transform:scale(1.04)">
<div style="position:absolute;left:210px;top:90px;width:860px;height:540px;display:flex;background:#110E0F;border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)">

<nav aria-label="Sections" style="width:64px;flex:none;background:#0D0B0B;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px">
<svg width="26" height="26" viewBox="0 0 24 24" role="img" aria-label="Velo" style="margin-bottom:12px"><path d="M3 5l5 0 4 9 4-9 5 0-7 15h-4z" fill="#D7262D"></path></svg>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="7">
<button class="velo-rail-btn" aria-label="{{r.label}}" title="{{r.label}}" onClick="{{r.pick}}" style="{{r.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></button>
</sc-for>
<div style="flex:1"></div>
<button class="velo-rail-btn" aria-label="Settings" title="Settings" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#8E8586;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4"></path></svg></button>
<div role="img" aria-label="Your account" style="width:30px;height:30px;border-radius:7px;margin-top:6px;background:linear-gradient(#3B2A22 0 38%,#C89A78 38% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div>
</nav>

<div style="flex:1;min-width:0;display:flex;flex-direction:column;padding:20px 24px 0">
<div style="display:flex;align-items:center;gap:12px">
<h1 style="margin:0;font-family:Archivo,sans-serif;font-stretch:112%;font-weight:700;font-size:21px;letter-spacing:.2px">Modules</h1>
<div style="flex:1"></div>
<label style="display:flex;align-items:center;gap:8px;width:250px;height:36px;padding:0 12px;box-sizing:border-box;background:#1A1617;border:1px solid rgba(255,255,255,.06);border-radius:9px;color:#8E8586">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
<input placeholder="Search… (Ctrl+F)" aria-label="Search modules" style="flex:1;min-width:0;background:transparent;border:0;outline:0;color:#F2ECEB;font:inherit;font-size:13px">
</label>
<button style="height:36px;padding:0 12px;display:flex;align-items:center;gap:8px;background:#1A1617;border:1px solid rgba(255,255,255,.06);border-radius:9px;color:#F2ECEB;font:inherit;font-size:13px;font-weight:500;cursor:pointer">PvP profile<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8586" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button style="height:36px;padding:0 14px;display:flex;align-items:center;gap:8px;background:#2A1416;border:1px solid rgba(215,38,45,.45);border-radius:9px;color:#FF6B6F;font:inherit;font-size:13px;font-weight:600;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18v14H3zM3 9h18M8 9v10"></path></svg>Edit HUD</button>
</div>

<div role="tablist" aria-label="Categories" style="display:flex;gap:4px;margin-top:16px;border-bottom:1px solid rgba(255,255,255,.06)">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<button role="tab" class="velo-chip" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<div style="flex:1;min-height:0;overflow:hidden;padding:16px 0">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
<sc-for list="{{shown}}" as="m" hint-placeholder-count="16">
<div class="velo-tile" style="height:88px;box-sizing:border-box;padding:12px;border-radius:11px;background:#171314;border:1px solid {{m.border}};display:flex;flex-direction:column;justify-content:space-between;cursor:pointer">
<div style="display:flex;align-items:flex-start;justify-content:space-between">
<div style="width:34px;height:34px;border-radius:9px;background:{{m.iconBg}};color:{{m.iconFg}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg></div>
<button aria-label="{{m.toggleLabel}}" onClick="{{m.toggle}}" style="width:32px;height:18px;border:0;border-radius:9px;padding:2px;background:{{m.track}};cursor:pointer;display:flex;justify-content:{{m.knobSide}}"><span style="width:14px;height:14px;border-radius:7px;background:#fff;display:block"></span></button>
</div>
<div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{m.name}}</div>
</div>
</sc-for>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { cat: 'All', rail: 0, on: { fps: true, keys: true, coords: true, sprint: true, crosshair: true, armor: true, potion: true, zoom: true, boost: true, cps: true } };
  }
  renderVals() {
    const I = {
      grid: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z', locker: 'M8 4l4 2 4-2 4 3-2 4h-2v9H8v-9H6L4 7z',
      friends: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3 3-5 6-5s6 2 6 5M16 11a3 3 0 1 0 0-6M21 20c0-2-1.5-3.5-3.5-4.3',
      clips: 'M4 5h16v14H4zM10 9l5 3-5 3z', map: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14', store: 'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2',
      rewind: 'M11 7l-6 5 6 5zM19 7l-6 5 6 5z',
      fps: 'M4 18h16M6 14l4-4 3 3 5-6', keys: 'M3 7h18v10H3zM7 11h2M11 11h2M15 11h2M8 14h8', coords: 'M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      zoom: 'M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-6-6M7 10h6M10 7v6', crosshair: 'M12 3v6M12 15v6M3 12h6M15 12h6', sun: 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',
      sprint: 'M5 12h10M11 6l6 6-6 6', armor: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', potion: 'M9 3h6M10 3v5l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3',
      combo: 'M4 14l4-8 4 8 4-8 4 8', sword: 'M14 4h6v6l-9 9-3-3zM5 16l3 3M4 20l2-2', minimap: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 3v18M3 12h18',
      bolt: 'M13 2L4 14h7l-1 8 9-12h-7z', cloak: 'M7 3h10l2 18-7-3-7 3z', moon: 'M20 14a8 8 0 1 1-10-10 7 7 0 0 0 10 10z', chat: 'M4 5h16v11H9l-5 4z',
      ping: 'M5 19v-3M10 19v-7M15 19v-10M20 19V5', eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
      blur: 'M3 8h10M3 12h14M3 16h8M17 8h4M19 16h2', target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', mouse: 'M12 3a6 6 0 0 1 6 6v6a6 6 0 0 1-12 0V9a6 6 0 0 1 6-6zM12 7v4'
    };
    const mods = [
      ['fps', 'FPS Counter', 'HUD', I.fps], ['keys', 'Keystrokes', 'HUD', I.keys], ['cps', 'Mouse Buttons', 'HUD', I.mouse], ['coords', 'Coordinates', 'HUD', I.coords],
      ['armor', 'Armor & Durability', 'HUD', I.armor], ['potion', 'Potion Effect Timers', 'HUD', I.potion], ['ping', 'Ping Display', 'HUD', I.ping], ['clock', 'Clock', 'HUD', I.clock],
      ['crosshair', 'Custom Crosshair', 'PvP', I.crosshair], ['combo', 'Combo Counter', 'PvP', I.combo], ['hitcolor', 'Hit Color', 'PvP', I.sword], ['target', 'Target HUD', 'PvP', I.target],
      ['zoom', 'Zoom', 'Utility', I.zoom], ['sprint', 'Toggle Sprint', 'Utility', I.sprint], ['freelook', 'Free Look', 'Utility', I.eye], ['chat', 'Chat', 'Utility', I.chat],
      ['bright', 'Full Bright', 'Visuals', I.sun], ['time', 'Time, Weather & Fog', 'Visuals', I.moon], ['blur', 'Motion Blur', 'Visuals', I.blur], ['minimap', 'Minimap', 'HUD', I.minimap],
      ['boost', 'Performance Boost', 'Performance', I.bolt], ['cloak', 'Cosmetic Cloaks', 'Visuals', I.cloak]
    ];
    const cats = ['All', 'HUD', 'PvP', 'Visuals', 'Utility', 'Performance', 'More'];
    const on = this.state.on;
    const shown = mods.filter(m => this.state.cat === 'All' || m[2] === this.state.cat).slice(0, 16).map(m => {
      const active = !!on[m[0]];
      return {
        name: m[1], icon: m[3],
        iconBg: active ? 'rgba(215,38,45,.16)' : '#221C1D', iconFg: active ? '#FF6B6F' : '#A39A9B',
        border: active ? 'rgba(215,38,45,.28)' : 'rgba(255,255,255,.05)',
        track: active ? '#D7262D' : '#3A3233', knobSide: active ? 'flex-end' : 'flex-start',
        toggleLabel: m[1] + (active ? ' off' : ' on'),
        toggle: (e) => { if (e) e.stopPropagation(); this.setState({ on: { ...on, [m[0]]: !active } }); }
      };
    });
    const railItems = [['Modules', I.grid], ['Locker', I.locker], ['Friends', I.friends], ['Clips', I.clips], ['Velo Rewind', I.rewind], ['Map', I.map], ['Store', I.store]];
    const rail = railItems.map((r, i) => ({
      label: r[0], icon: r[1], pick: () => this.setState({ rail: i }),
      style: 'width:44px;height:44px;border:0;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;'
        + (this.state.rail === i ? 'background:rgba(215,38,45,.14);color:#FF6B6F' : 'background:transparent;color:#8E8586')
    }));
    return {
      shown, rail,
      cats: cats.map(c => ({
        label: c, pick: () => this.setState({ cat: c }),
        style: 'height:36px;padding:0 12px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:-1px;'
          + (this.state.cat === c ? 'color:#F2ECEB;border-bottom:2px solid #D7262D' : 'color:#8E8586;border-bottom:2px solid transparent')
      }))
    };
  }
}
</script>
</body>
</html>
