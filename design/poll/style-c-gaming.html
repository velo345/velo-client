<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Style C - Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Inter:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;background:#08060A}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover;filter:brightness(.35) saturate(1.2)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,6,10,.92) 0%,rgba(8,6,10,.6) 45%,rgba(8,6,10,.2) 100%),linear-gradient(0deg,rgba(8,6,10,.95) 0%,rgba(8,6,10,0) 45%)}
.top{position:absolute;left:70px;right:70px;top:46px;display:flex;align-items:center;gap:34px}
.logo{font-family:Archivo;font-stretch:112%;font-weight:800;font-size:30px;letter-spacing:.5px;display:flex;align-items:center;gap:12px}
.logo i{width:16px;height:16px;background:#E5373E;transform:rotate(45deg);display:block;box-shadow:0 0 18px #E5373E}
.nav{display:flex;gap:30px;font-family:Archivo;font-stretch:112%;font-weight:700;font-size:17px;letter-spacing:1px;color:rgba(255,255,255,.55)}
.nav .on{color:#fff;position:relative}.nav .on:after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:3px;background:#E5373E;box-shadow:0 0 12px #E5373E}
.grow{flex:1}
.pill{height:46px;padding:0 18px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:10px;font-size:15px}
.hero{position:absolute;left:70px;top:150px}
.hero h1{margin:0;font-family:Archivo;font-stretch:112%;font-weight:800;font-size:64px;line-height:1}
.hero p{margin:12px 0 0;color:rgba(255,255,255,.7);font-size:18px}
.cats{position:absolute;left:70px;right:70px;top:300px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.cat{height:170px;border-radius:14px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#15111A;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}
.cat:before{content:"";position:absolute;inset:0;background:url(bg.jpg) var(--p)/600% auto;filter:brightness(.6) saturate(1.3);transition:none}
.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,8,12,.95),rgba(10,8,12,.1))}
.cat>*{position:relative;z-index:1}
.cat.on{border:2px solid #E5373E;box-shadow:0 0 30px rgba(229,55,62,.45)}
.cat .ic{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin-bottom:auto}
.cat.on .ic{background:#E5373E}
.cat b{font-family:Archivo;font-stretch:112%;font-weight:800;font-size:20px;letter-spacing:.5px}.cat small{color:rgba(255,255,255,.6);font-size:13px}
.row{position:absolute;left:70px;right:70px;top:510px}
.row h2{margin:0 0 14px;font-family:Archivo;font-stretch:112%;font-weight:700;font-size:18px;letter-spacing:1.5px;color:rgba(255,255,255,.7)}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.mod{height:200px;border-radius:14px;background:linear-gradient(160deg,#211A28,#120E16);border:1px solid rgba(255,255,255,.1);padding:18px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.mod .glow{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(rgba(229,55,62,.35),transparent 70%)}
.mod .ic{color:#fff}
.mod b{margin-top:auto;font-family:Archivo;font-stretch:112%;font-weight:700;font-size:19px}.mod small{color:rgba(255,255,255,.6);font-size:13px;margin-top:4px}
.state{position:absolute;right:16px;top:16px;font-family:'Geist Mono';font-size:12px;padding:5px 10px;border-radius:6px;background:#E5373E;box-shadow:0 0 14px rgba(229,55,62,.6)}
.state.off{background:rgba(255,255,255,.1);box-shadow:none;color:rgba(255,255,255,.6)}
.foot{position:absolute;left:70px;right:70px;bottom:36px;display:flex;gap:26px;color:rgba(255,255,255,.55);font-family:'Geist Mono';font-size:14px}
.foot kbd{padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.12);color:#fff;margin-right:6px}
.tag{position:absolute;right:70px;top:150px;font-family:'Geist Mono';font-size:15px;padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2)}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="tag">STYLE C · GAMING</div>
<div class="top">
 <div class="logo"><i></i>VELO</div>
 <div class="nav"><span class="on">MODULES</span><span>LOCKER</span><span>FRIENDS</span><span>CLIPS</span><span>MAP</span></div>
 <div class="grow"></div>
 <div class="pill"><span data-i="search" data-s="18"></span>Search</div>
 <div class="pill"><span data-i="user" data-s="18"></span>PvP<span data-i="chevd" data-s="16"></span></div>
 <div class="pill" style="background:#E5373E;border-color:#E5373E;font-weight:700"><span data-i="layout" data-s="18"></span>EDIT HUD</div>
</div>
<div class="hero"><h1>PvP</h1><p>29 modules for fights and duels · 9 turned on</p></div>
<div class="cats" id="cats"></div>
<div class="row"><h2>POPULAR IN PVP</h2><div class="mods" id="mods"></div></div>
<div class="foot"><span><kbd>Q</kbd><kbd>E</kbd>switch category</span><span><kbd>Enter</kbd>toggle</span><span><kbd>Esc</kbd>back to game</span></div>
<script>
const cats=[['layout','HUD',33,'0% 30%'],['swords','PvP',29,'70% 40%',1],['sparkles','Visuals',28,'30% 10%'],['wrench','Utility',35,'50% 80%'],['zap','Performance',17,'90% 20%'],['cpu','Advanced',19,'10% 90%']];
document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${c[4]?'on':''}" style="--p:${c[3]}"><div class="ic" data-i="${c[0]}" data-s="22"></div><b>${c[1].toUpperCase()}</b><small>${c[2]} modules</small></div>`).join('');
const mods=[['crosshair','Custom Crosshair','Aim with your own shape',1],['trend','Combo Counter','Count your combos',1],['swords','Hit Color','See every hit land',1],['shield','Target HUD','Enemy health and armor',0],['activity','Old Animations','1.7 blocking and swing',0]];
document.getElementById('mods').innerHTML=mods.map(m=>`<div class="mod"><div class="glow"></div><div class="state ${m[3]?'':'off'}">${m[3]?'ON':'OFF'}</div><div class="ic" data-i="${m[0]}" data-s="34" data-w="1.6"></div><b>${m[1]}</b><small>${m[2]}</small></div>`).join('');
</script>
<script src="icons.js"></script>
</body></html>
