<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Style C - Split view</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:Inter,sans-serif;color:#E8E8EC;background:#000}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover;filter:brightness(.55)}
.win{position:absolute;left:230px;top:110px;width:1140px;height:680px;background:#0F0F12;border:1px solid #26262C;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.bar{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #22222A;background:#121216}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.3px}.logo i{width:10px;height:10px;background:#E5373E;border-radius:2px;display:block}
.tabs{display:flex;gap:2px;margin-left:12px}.tabs span{padding:8px 14px;border-radius:6px;font-size:14px;color:#8C8C96;font-weight:500}.tabs span.on{background:#1E1E24;color:#fff}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;width:230px;height:34px;padding:0 12px;border-radius:6px;background:#1A1A20;border:1px solid #26262C;color:#7A7A84;font-size:13.5px}
.k{font-family:'Geist Mono';font-size:11px;padding:2px 6px;border-radius:4px;background:#26262C;color:#9A9AA4;margin-left:auto}
.prof{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:6px;border:1px solid #2C2C34;font-size:13.5px;font-weight:600}
.edit{height:34px;padding:0 14px;border-radius:6px;background:#E5373E;color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.body{flex:1;display:flex;min-height:0}
.list{width:420px;border-right:1px solid #22222A;overflow:hidden;padding:10px 10px}
.gh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:#6E6E78;text-transform:uppercase;padding:12px 10px 6px}
.gh small{font-family:'Geist Mono';font-weight:500;letter-spacing:0;margin-left:auto}
.m{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:6px;font-size:14px}
.m.sel{background:#1C1C23;box-shadow:inset 2px 0 0 #E5373E}
.m .n{flex:1}
.dot{width:8px;height:8px;border-radius:2px;background:#3A3A44}.dot.on{background:#3DDC84;box-shadow:0 0 8px rgba(61,220,132,.5)}
.insp{flex:1;padding:26px 30px;display:flex;flex-direction:column;gap:18px}
.ih{display:flex;align-items:center;gap:14px}
.ibox{width:46px;height:46px;border-radius:8px;background:#1E1E24;border:1px solid #2C2C34;display:flex;align-items:center;justify-content:center;color:#fff}
.ih h1{margin:0;font-size:22px}.ih p{margin:3px 0 0;color:#8C8C96;font-size:14px}
.sw{margin-left:auto;width:44px;height:24px;border-radius:12px;background:#E5373E;padding:3px}.sw i{display:block;width:18px;height:18px;border-radius:9px;background:#fff;transform:translateX(20px)}
.prev{height:170px;border-radius:8px;border:1px solid #26262C;background:url(bg.jpg) 60% 45%/cover;position:relative;overflow:hidden}
.prev:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
.prev svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1}
.pl{position:absolute;left:10px;top:10px;z-index:1;font-family:'Geist Mono';font-size:11px;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.6);color:#ddd}
.set{display:flex;align-items:center;gap:14px;height:44px;border-bottom:1px solid #1E1E26;font-size:14px}
.set .l{flex:1;color:#C8C8D0}
.segs{display:flex;border:1px solid #2C2C34;border-radius:6px;overflow:hidden}.segs span{padding:6px 14px;font-size:13px;color:#9A9AA4;border-right:1px solid #2C2C34}.segs span:last-child{border:0}.segs span.on{background:#E5373E;color:#fff}
.slider{width:220px;height:4px;border-radius:2px;background:#2A2A32;position:relative}.slider b{position:absolute;left:0;top:0;bottom:0;width:40%;background:#E5373E;border-radius:2px}.slider i{position:absolute;left:40%;top:50%;width:14px;height:14px;margin:-7px;border-radius:7px;background:#fff}
.val{font-family:'Geist Mono';font-size:12.5px;color:#9A9AA4;width:36px;text-align:right}
.sws{display:flex;gap:8px}.sws i{width:20px;height:20px;border-radius:4px;display:block;border:1px solid rgba(255,255,255,.15)}.sws i.on{outline:2px solid #fff;outline-offset:2px}
.tg{width:40px;height:22px;border-radius:11px;background:#2A2A32;padding:3px}.tg i{display:block;width:16px;height:16px;border-radius:8px;background:#9A9AA4}
.tg.on{background:#E5373E}.tg.on i{background:#fff;transform:translateX(18px)}
.tag{position:absolute;left:40px;top:28px;font-family:'Geist Mono';font-size:15px;padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff}
</style></head><body>
<div class="bg"></div>
<div class="tag">STYLE C · SPLIT VIEW</div>
<div class="win">
 <div class="bar">
  <div class="logo"><i></i>VELO</div>
  <div class="tabs"><span class="on">Modules</span><span>Locker</span><span>Friends</span><span>Clips</span><span>Map</span><span>Settings</span></div>
  <div class="grow"></div>
  <div class="search"><span data-i="search" data-s="15"></span>Search<span class="k">Ctrl F</span></div>
  <div class="prof"><span data-i="user" data-s="15"></span>PvP<span data-i="chevd" data-s="14"></span></div>
  <div class="edit"><span data-i="layout" data-s="15"></span>Edit HUD</div>
 </div>
 <div class="body">
  <div class="list" id="list"></div>
  <div class="insp">
   <div class="ih"><div class="ibox" data-i="crosshair" data-s="22"></div><div><h1>Custom Crosshair</h1><p>Aim with your own shape</p></div><div class="sw"><i></i></div></div>
   <div class="prev"><span class="pl">LIVE PREVIEW</span><svg width="44" height="44" viewBox="0 0 44 44"><path d="M22 10v8M22 26v8M10 22h8M26 22h8" stroke="#000" stroke-width="5"/><path d="M22 10v8M22 26v8M10 22h8M26 22h8" stroke="#fff" stroke-width="2.5"/></svg></div>
   <div>
    <div class="set"><span class="l">Shape</span><div class="segs"><span class="on">Plus</span><span>Dot</span><span>Circle</span><span>T</span></div></div>
    <div class="set"><span class="l">Size</span><div class="slider"><b></b><i></i></div><span class="val">11</span></div>
    <div class="set"><span class="l">Colour</span><div class="sws"><i class="on" style="background:#fff"></i><i style="background:#E5484D"></i><i style="background:#F5B544"></i><i style="background:#46C46E"></i><i style="background:#3DC6E0"></i></div></div>
    <div class="set"><span class="l">Outline</span><div class="tg on"><i></i></div></div>
    <div class="set" style="border:0"><span class="l">Show in third person</span><div class="tg"><i></i></div></div>
   </div>
  </div>
 </div>
</div>
<script>
const groups=[['HUD',33,[['gauge','FPS Counter',1],['keyboard','Keystrokes',1],['pin','Coordinates',0],['shield','Armor Status',1]]],
['PvP',29,[['crosshair','Custom Crosshair',1,1],['trend','Combo Counter',1],['swords','Hit Color',0],['activity','Old Animations',0]]],
['Utility',35,[['zoom','Zoom',1],['run','Toggle Sprint',1]]]];
document.getElementById('list').innerHTML=groups.map(g=>`<div class="gh">${g[0]}<small>${g[1]}</small></div>`+g[2].map(m=>`<div class="m ${m[3]?'sel':''}"><span data-i="${m[0]}" data-s="17" data-c="#B8B8C2"></span><span class="n">${m[1]}</span><span class="dot ${m[2]?'on':''}"></span></div>`).join('')).join('');
</script>
<script src="icons.js"></script>
</body></html>
