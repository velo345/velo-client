<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Style A - Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:Geist,sans-serif;color:#fff;background:#000}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover;filter:brightness(.75)}
.win{position:absolute;left:150px;top:80px;width:1300px;height:740px;border-radius:32px;background:rgba(20,20,24,.5);
 backdrop-filter:blur(34px) saturate(1.5);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:28px 32px}
.top{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;margin-right:18px}
.logo i{width:12px;height:12px;border-radius:3px;background:#E5373E;display:block}
.seg{display:flex;padding:4px;border-radius:22px;background:rgba(0,0,0,.28)}
.seg span{padding:9px 18px;border-radius:18px;font-size:15px;font-weight:600;color:rgba(255,255,255,.75)}
.seg span.on{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:10px;width:280px;height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);font-size:15px}
.prof{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font-size:15px;font-weight:600}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:16px;margin-top:26px}
.card{position:relative;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.card.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.ic{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.card.on .ic{background:#fff;color:#111}
.name{font-size:18px;font-weight:600}.hint{font-size:13.5px;color:rgba(255,255,255,.6);margin-top:3px}
.sw{position:absolute;right:20px;top:24px;width:46px;height:27px;border-radius:14px;background:rgba(255,255,255,.2);padding:2px}
.sw b{display:block;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.card.on .sw{background:#fff}.card.on .sw b{background:#141416;transform:translateX(19px)}
.bottom{display:flex;align-items:center;gap:12px;margin-top:22px}
.edit{height:50px;padding:0 26px;border-radius:25px;background:#fff;color:#111;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
.dock{display:flex;gap:10px}.dock span{width:50px;height:50px;border-radius:25px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.tag{position:absolute;left:40px;top:28px;font-family:'Geist Mono';font-size:15px;padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2)}
</style></head><body>
<div class="bg"></div>
<div class="tag">STYLE A · GLASS</div>
<div class="win">
 <div class="top">
  <div class="logo"><i></i>Velo</div>
  <div class="seg"><span class="on">All</span><span>HUD</span><span>PvP</span><span>Visuals</span><span>Utility</span><span>Performance</span></div>
  <div class="grow"></div>
  <div class="search"><span data-i="search" data-s="18"></span>Search modules</div>
  <div class="prof"><span data-i="user" data-s="17"></span>PvP<span data-i="chevd" data-s="16"></span></div>
 </div>
 <div class="grid" id="grid"></div>
 <div class="bottom">
  <div class="edit"><span data-i="layout" data-s="19" data-c="#111"></span>Edit HUD</div>
  <div class="grow"></div>
  <div class="dock"><span data-i="shirt" data-s="21"></span><span data-i="users" data-s="21"></span><span data-i="video" data-s="21"></span><span data-i="map" data-s="21"></span><span data-i="sliders" data-s="21"></span></div>
 </div>
</div>
<script>
const mods=[['gauge','FPS Counter','Your frame rate',1],['keyboard','Keystrokes','WASD and clicks',1],['crosshair','Custom Crosshair','Your own shape',1],['zoom','Zoom','Scroll to zoom',1],
['pin','Coordinates','XYZ and facing',0],['shield','Armor Status','When gear breaks',1],['run','Toggle Sprint','Never hold Ctrl',1],['sun','Full Bright','See in the dark',0],
['trend','Combo Counter','Count your combos',0],['eye','Free Look','Look around freely',1],['moon','Time & Weather','Your own sky',0],['zap','Performance Boost','More FPS',1]];
document.getElementById('grid').innerHTML=mods.map(m=>`<div class="card ${m[3]?'on':''}"><div class="sw"><b></b></div><div class="ic" data-i="${m[0]}" data-s="24"></div><div><div class="name">${m[1]}</div><div class="hint">${m[2]}</div></div></div>`).join('');
</script>
<script src="icons.js"></script>
</body></html>
