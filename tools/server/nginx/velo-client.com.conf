# The website: velo-client.com (www redirects to it). Static files built by velo-site (npm run build),
# uploaded to /var/www/velo-client.com by velo-site/deploy.sh. certbot --nginx adds the 443 blocks and certificates.

server {
	listen 80;
	listen [::]:80;
	server_name www.velo-client.com;
	return 301 https://velo-client.com$request_uri;
}

server {
	listen 80;
	listen [::]:80;
	server_name velo-client.com;

	root /var/www/velo-client.com;
	index index.html;
	charset utf-8;

	# Clean URLs: /store -> store.html, /news/0-9-7 -> news/0-9-7.html or news/0-9-7/index.html.
	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header X-Frame-Options SAMEORIGIN always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		try_files $uri $uri.html $uri/ =404;
	}
	# One address per page (SEO): /store.html -> /store.
	if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
		return 301 /$1$2;
	}

	error_page 404 /404.html;

	# The ad network reads ads.txt on the main domain; the server writes it (StoreRoutes).
	location = /ads.txt {
		proxy_pass http://127.0.0.1:8787/ads.txt;
	}

	# Fonts never change; images, CSS and JS keep their names across releases, so they're cached for a week and
	# re-checked after that. Pages are re-checked on every visit.
	location ~* \.(?:woff2?)$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		access_log off;
		try_files $uri =404;
	}
	location ~* \.(?:css|js|png|jpe?g|webp|avif|gif|svg|ico|mp4|webm)$ {
		add_header Cache-Control "public, max-age=604800, must-revalidate";
		access_log off;
		try_files $uri =404;
	}
	location ~* \.(?:html|xml|txt|json)$ {
		# add_header here replaces the server-level ones below, so pages repeat them.
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header X-Frame-Options SAMEORIGIN always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		try_files $uri =404;
	}

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 512;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
