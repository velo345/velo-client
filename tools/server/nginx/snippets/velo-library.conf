# The Velo Library (velo-client.com/library): its own service on 127.0.0.1:8791, its own limits and a response cache in
# front of it. If it's down, overloaded or switched off, only /v2 answers 503 - velo-server (/v1) never notices.
location ^~ /v2/ {
	limit_req zone=library_api burst=20 nodelay;
	limit_conn library_conn 6;
	client_max_body_size 300k;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
# Item icons: tiny and cached - a page shows hundreds at once.
location ^~ /v2/blocktex/ {
	limit_req zone=library_icons burst=300 nodelay;
	limit_conn library_conn 12;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
location ^~ /v2/sprite/ {
	limit_req zone=library_icons burst=300 nodelay;
	limit_conn library_conn 12;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
location ^~ /v2/mcbanner {
	limit_req zone=library_icons burst=300 nodelay;
	limit_conn library_conn 12;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
location ^~ /v2/blockfaces {
	limit_req zone=library_icons burst=300 nodelay;
	limit_conn library_conn 12;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
location ^~ /v2/item/ {
	limit_req zone=library_icons burst=300 nodelay;
	limit_conn library_conn 12;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
# Heavy work (spark, seed maps, plugin checks): a much tighter per-address budget.
location ^~ /v2/spark/ {
	limit_req zone=library_heavy burst=2 nodelay;
	limit_conn library_conn 2;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
location ^~ /v2/seed/ {
	limit_req zone=library_api burst=20 nodelay;
	limit_conn library_conn 4;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
location ^~ /v2/plugins/ {
	limit_req zone=library_heavy burst=2 nodelay;
	limit_conn library_conn 1;
	client_max_body_size 64k;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
# "Add your server" (logo + banner as base64): bigger bodies, few per address.
location ^~ /v2/servers/submit {
	limit_req zone=library_heavy burst=3 nodelay;
	limit_conn library_conn 1;
	client_max_body_size 4m;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
# Generated schematics (map art, pixel art) - up to 3 MB.
location = /v2/schem {
	limit_req zone=library_heavy burst=3 nodelay;
	limit_conn library_conn 1;
	client_max_body_size 4m;
	include /etc/nginx/snippets/velo-library-proxy.conf;
}
# Pack uploads: streamed straight through (up to 50 MB), few per address.
location = /v2/packs {
	limit_req zone=library_heavy burst=1 nodelay;
	limit_conn library_conn 1;
	client_max_body_size 51m;
	proxy_request_buffering off;
	include /etc/nginx/snippets/velo-proxy.conf;
	proxy_connect_timeout 2s;
	proxy_send_timeout 600s;
	proxy_read_timeout 600s;
	proxy_next_upstream off;
	proxy_pass http://velo_library;
}
# Hosted resource packs: plain files from disk (sendfile) - downloads never reach Java.
location ^~ /packs/ {
	alias /opt/velo/library/data/packs/;
	types {
		application/zip zip;
		image/png png;
	}
	default_type application/octet-stream;
	limit_conn library_conn 3;
	limit_rate_after 2m;
	limit_rate 8m;
	add_header Cache-Control "public, max-age=31536000, immutable" always;
	add_header Access-Control-Allow-Origin "*" always;
	add_header X-Content-Type-Options "nosniff" always;
}
location @library_down {
	default_type application/json;
	add_header Retry-After 60 always;
	add_header Cache-Control "no-store" always;
	return 503 '{"error":"The Velo Library is offline for a moment - try again soon","status":503}';
}
