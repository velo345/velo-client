# Shared by the Library's proxied locations (see velo-library.conf).
include /etc/nginx/snippets/velo-proxy.conf;
proxy_connect_timeout 2s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
proxy_next_upstream off;
# Same URL again = answered by nginx from disk, the Library never sees it (keys and sign-ins bypass the cache).
proxy_cache library;
proxy_cache_key $request_method$host$uri$is_args$args;
proxy_cache_methods GET HEAD;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_bypass $http_authorization $arg_key;
proxy_no_cache $http_authorization $arg_key;
add_header X-Library-Cache $upstream_cache_status always;
proxy_intercept_errors on;
error_page 502 504 = @library_down;
proxy_pass http://velo_library;
