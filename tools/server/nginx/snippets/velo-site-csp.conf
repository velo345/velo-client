# velo-client.com: everything is served from the site itself (fonts too - no Google Fonts, no trackers).
# Checkout opens on Tebex's own site (a navigation, not a frame).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; media-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
