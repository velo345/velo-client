# Server move (2026-11-07): installed on the PREVIOUS host in place of velo.conf once the new host (62.129.150.101)
# serves everything. Caddy there still terminates TLS for anyone whose DNS answer is the old address; this forwards
# every Velo host as-is to the new host (HTTPS, same host name, so its Caddy picks the right certificate) and names
# the player's address in X-Velo-Client-IP, which the new host trusts only from this machine (see velo.conf).
# Rollback: put velo.conf back and restart nginx.

set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_upgrade $velo_fwd_connection {
	default "";
	websocket upgrade;
}

server {
	listen 127.0.0.1:8080 default_server;
	listen 172.18.0.1:8080 default_server;
	server_name _;

	client_max_body_size 128m;
	proxy_request_buffering off;
	proxy_buffering off;
	proxy_read_timeout 900s;
	proxy_send_timeout 900s;

	location / {
		proxy_pass https://62.129.150.101;
		proxy_ssl_server_name on;
		proxy_ssl_name $host;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $velo_fwd_connection;
		proxy_set_header X-Velo-Client-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
	}
}
