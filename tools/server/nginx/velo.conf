# Velo on the shared server: velo-client.com (site + API), api.velo-client.com, panel.velo-client.com.
#
# Ports 80/443 belong to the FlipSMP Caddy container (/home/pwjzns/flipsmp), which terminates TLS (Let's Encrypt,
# renewed automatically) and forwards the Velo hosts here (tools/server/caddy/velo.caddy). nginx therefore only
# listens on loopback and on the Docker bridge Caddy lives on - nothing of this is reachable from outside directly.
# Installed as /etc/nginx/conf.d/velo.conf by tools/server/setup-velo-host.sh.

# The visitor's real address: Caddy (on the Docker bridge) puts it in X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Old servers forward to this one and name the player's address in X-Velo-Client-IP - trusted only when the request
# really comes from them: AsteriaSMP (client.asteriasmp.net, pre-0.9.8 clients) and the previous Velo host during a move.
map $remote_addr $velo_client_ip {
	default $remote_addr;
	45.92.216.58 $velo_forwarded_ip;
	# The previous server (62.129.150.119) forwards everything here while DNS moves over (tools/server/nginx/velo-forward.conf).
	62.129.150.119 $velo_forwarded_ip;
}
map $http_x_velo_client_ip $velo_forwarded_ip {
	"~^[0-9a-fA-F:.]{3,45}$" $http_x_velo_client_ip;
	default 45.92.216.58;
}

limit_req_zone $velo_client_ip zone=velo_api:20m rate=30r/s;
limit_req_zone $velo_client_ip zone=velo_login:10m rate=10r/m;
limit_req_zone $velo_client_ip zone=velo_admin:10m rate=5r/s;
limit_req_zone $velo_client_ip zone=velo_panel:10m rate=20r/s;
limit_conn_zone $velo_client_ip zone=velo_conn:10m;
# Release downloads (velo-client.com/dl, the launcher's first choice since 1.3.2): per address and for the whole server.
limit_req_zone $velo_client_ip zone=velo_dl:10m rate=30r/m;
limit_conn_zone $velo_client_ip zone=velo_dl_ip:10m;
limit_conn_zone $server_name zone=velo_dl_all:1m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;
# Redirects stay relative (nginx itself sits on :8080 behind Caddy, which the browser never sees).
absolute_redirect off;

upstream velo_server {
	server 127.0.0.1:8787;
	keepalive 16;
}

# The Velo Library (separate service, see snippets/velo-library.conf): own limits, own cache, own upstream.
limit_req_zone $velo_client_ip zone=library_api:20m rate=7r/s;
limit_req_zone $velo_client_ip zone=library_heavy:10m rate=6r/m;
limit_req_zone $velo_client_ip zone=library_icons:10m rate=30r/s;
limit_conn_zone $velo_client_ip zone=library_conn:10m;
proxy_cache_path /var/cache/nginx/velo-library levels=1:2 keys_zone=library:32m max_size=3g inactive=6h use_temp_path=off;

upstream velo_library {
	server 127.0.0.1:8791 max_fails=0;
	keepalive 8;
}

upstream velo_panel {
	server 127.0.0.1:8790;
	keepalive 4;
}

# Shared by every proxied Velo location.
map $http_upgrade $velo_connection {
	default "";
	websocket upgrade;
}

server {
	listen 127.0.0.1:8080 default_server;
	listen 172.18.0.1:8080 default_server;
	server_name _;
	return 444;
}

server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name www.velo-client.com;
	return 301 https://velo-client.com$request_uri;
}

# ---- The website (static, built by velo-site) + the API under /v1 on the same origin ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name velo-client.com;

	root /var/www/velo-client.com;
	index index.html;
	charset utf-8;
	limit_conn velo_conn 64;
	access_log /var/log/nginx/velo-site.access.log;
	error_log /var/log/nginx/velo-site.error.log warn;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 512;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;

	include /etc/nginx/snippets/velo-headers.conf;
	include /etc/nginx/snippets/velo-site-csp.conf;

	# One address per page (SEO): /store.html -> /store, /index -> /.
	if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
		return 301 /$1$2;
	}
	location = /index {
		return 301 /;
	}
	# Old addresses of the legal pages.
	location = /datenschutz { return 301 /privacy; }
	location = /impressum { return 301 /imprint; }

	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		include /etc/nginx/snippets/velo-headers.conf;
		include /etc/nginx/snippets/velo-site-csp.conf;
		try_files $uri $uri.html $uri/ =404;
	}

	# Release files (tools/release/mirror_release.sh). Spam-proof and kept from crowding out the API on the same line:
	# 3 files at once per address, 30 requests a minute, 40 downloads at once in total, 15 MB/s per download. Over a
	# limit the answer is 503 and the launcher takes GitHub instead; the website's buttons simply retry.
	location ^~ /dl/ {
		limit_req zone=velo_dl burst=40 nodelay;
		limit_conn velo_dl_ip 3;
		limit_conn velo_dl_all 40;
		limit_conn_status 503;
		limit_req_status 503;
		limit_rate_after 4m;
		limit_rate 15m;
		sendfile on;
		tcp_nopush on;
		add_header Cache-Control "public, max-age=3600" always;
		add_header Accept-Ranges bytes always;
		include /etc/nginx/snippets/velo-headers.conf;
		try_files $uri =404;
	}
	location = /dl/releases.json {
		limit_req zone=velo_dl burst=40 nodelay;
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/snippets/velo-headers.conf;
		try_files $uri =404;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
		add_header Cache-Control "no-cache";
		include /etc/nginx/snippets/velo-headers.conf;
		include /etc/nginx/snippets/velo-site-csp.conf;
	}

	location ~* \.(?:woff2?)$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include /etc/nginx/snippets/velo-headers.conf;
		access_log off;
		try_files $uri =404;
	}
	location ~* \.(?:css|js|png|jpe?g|webp|avif|gif|svg|ico|mp4|webm)$ {
		add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
		include /etc/nginx/snippets/velo-headers.conf;
		access_log off;
		try_files $uri =404;
	}

	include /etc/nginx/snippets/velo-library.conf;

	# The API on the same origin (no CORS needed for the web Store).
	location ^~ /v1/ {
		limit_req zone=velo_api burst=80 nodelay;
		client_max_body_size 16m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location = /v1/web/login {
		limit_req zone=velo_login burst=5 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ^~ /v1/admin/ {
		limit_req zone=velo_admin burst=40 nodelay;
		client_max_body_size 64m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_pass http://velo_server;
	}
	# Clips Pro share links: the page, the video (range requests) and its thumbnail come from the server.
	location ^~ /c/ {
		limit_req zone=velo_api burst=80 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_buffering off;
		proxy_pass http://velo_server;
	}
	# Pages the server renders itself (checkout return, ad page) and ads.txt for the ad network.
	location ~ ^/(store/done(/status)?|rewards/ad)$ {
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	# exact, so the static-files rule for *.js doesn't take it
	location = /store/done.js {
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location = /ads.txt {
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
}

# ---- The API host; also client.asteriasmp.net once its DNS points here (pre-0.9.8 clients) ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name api.velo-client.com client.asteriasmp.net;
	limit_conn velo_conn 64;
	access_log /var/log/nginx/velo-api.access.log;
	error_log /var/log/nginx/velo-api.error.log warn;
	include /etc/nginx/snippets/velo-headers.conf;
	include /etc/nginx/snippets/velo-library.conf;

	location / {
		limit_req zone=velo_api burst=80 nodelay;
		client_max_body_size 16m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location = /v1/web/login {
		limit_req zone=velo_login burst=5 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ^~ /v1/admin/ {
		limit_req zone=velo_admin burst=40 nodelay;
		client_max_body_size 64m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_pass http://velo_server;
	}
	# Clips Pro uploads (up to 40 MB, re-encoded small by the game first; streamed through to the server).
	location = /v1/clips/upload {
		limit_req zone=velo_api burst=10 nodelay;
		client_max_body_size 48m;
		proxy_request_buffering off;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		proxy_pass http://velo_server;
	}
}

# ---- The owner panel ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name panel.velo-client.com;
	access_log /var/log/nginx/velo-panel.access.log;
	error_log /var/log/nginx/velo-panel.error.log warn;
	client_max_body_size 210m;
	include /etc/nginx/snippets/velo-headers.conf;
	add_header X-Robots-Tag "noindex, nofollow" always;

	location = /robots.txt {
		add_header Content-Type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}
	location / {
		limit_req zone=velo_panel burst=60 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_request_buffering off;
		proxy_pass http://velo_panel;
	}
	location = /api/login {
		limit_req zone=velo_login burst=5 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_panel;
	}
	location = /api/challenge {
		limit_req zone=velo_login burst=10 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_panel;
	}
	location ^~ /api/passkey/login {
		limit_req zone=velo_login burst=10 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_panel;
	}
}

# ---- The staff panel (staff.velo-client.com): static app + only the API routes it uses ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name staff.velo-client.com;
	access_log /var/log/nginx/velo-staff.access.log;
	error_log /var/log/nginx/velo-staff.error.log warn;
	root /var/www/staff.velo-client.com;
	include /etc/nginx/snippets/velo-headers.conf;
	add_header X-Robots-Tag "noindex, nofollow" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://velo-client.com https://cdn.discordapp.com https://media.discordapp.net; media-src 'self' https://velo-client.com; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

	location = /robots.txt {
		add_header Content-Type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}
	location / {
		try_files $uri /index.html;
	}
	location = /manifest.webmanifest {
		default_type application/manifest+json;
	}
	location ~ ^/(index\.html|sw\.js|app\.js|staff\.css|app\.css)?$ {
		try_files $uri /index.html;
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/snippets/velo-headers.conf;
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://velo-client.com https://cdn.discordapp.com https://media.discordapp.net; media-src 'self' https://velo-client.com; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
	}
	# Regex locations match in order: the sign-in routes (login rate limit) first.
	location ~ ^/v1/staffpanel/(login|passkey/login|passkey/login/options|redeem|request-code|challenge)$ {
		limit_req zone=velo_login burst=8 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ~ ^/v1/(staff|staffpanel|skins|cape)/ {
		limit_req zone=velo_panel burst=60 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	# Everything else of the API stays on api.velo-client.com (a plain prefix, so the regexes above win).
	location /v1/ {
		return 404;
	}
}

# ---- Velo Bridge for server owners (dev.velo-client.com): static docs + the plugin download ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name dev.velo-client.com;
	access_log /var/log/nginx/velo-dev.access.log;
	error_log /var/log/nginx/velo-dev.error.log warn;
	root /var/www/dev.velo-client.com;
	include /etc/nginx/snippets/velo-headers.conf;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://velo-client.com; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

	location / {
		try_files $uri $uri/ /index.html;
	}
	location ~ ^/(index\.html|app\.js|style\.css|config\.yml|modules\.json)?$ {
		try_files $uri /index.html;
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/snippets/velo-headers.conf;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://velo-client.com; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
	}
	location = /config.yml {
		default_type text/plain;
		charset utf-8;
		add_header Cache-Control "no-cache" always;
	}
	# Owner panel (/velobridge panel link): the page, and the API it needs on the same origin.
	location = /panel {
		try_files /panel.html =404;
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/snippets/velo-headers.conf;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://velo-client.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
		add_header Referrer-Policy "no-referrer" always;
	}
	location ^~ /v1/bridge/panel/ {
		limit_req zone=velo_panel burst=40 nodelay;
		client_max_body_size 7m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ^~ /v1/cosmetics/ {
		limit_req zone=velo_api burst=120 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ^~ /v1/cape/ {
		limit_req zone=velo_api burst=40 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ^~ /v1/skins/ {
		limit_req zone=velo_api burst=40 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location /downloads/ {
		add_header Content-Disposition "attachment" always;
		add_header Cache-Control "public, max-age=300" always;
	}
	location /fonts/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}
}
