# Velo on the shared server: velo-client.com (site + API), api.velo-client.com, panel.velo-client.com.
#
# Ports 80/443 belong to the FlipSMP Caddy container (/home/pwjzns/flipsmp), which terminates TLS (Let's Encrypt,
# renewed automatically) and forwards the Velo hosts here (tools/server/caddy/velo.caddy). nginx therefore only
# listens on loopback and on the Docker bridge Caddy lives on - nothing of this is reachable from outside directly.
# Installed as /etc/nginx/conf.d/velo.conf by tools/server/setup-velo-host.sh.

# The visitor's real address: Caddy (on the Docker bridge) puts it in X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The old AsteriaSMP server forwards client.asteriasmp.net here (pre-0.9.8 clients) and names the player's address
# in X-Velo-Client-IP - trusted only when the request really comes from that server.
map $remote_addr $velo_client_ip {
	default $remote_addr;
	45.92.216.58 $velo_forwarded_ip;
}
map $http_x_velo_client_ip $velo_forwarded_ip {
	"~^[0-9a-fA-F:.]{3,45}$" $http_x_velo_client_ip;
	default 45.92.216.58;
}

limit_req_zone $velo_client_ip zone=velo_api:20m rate=30r/s;
limit_req_zone $velo_client_ip zone=velo_login:10m rate=10r/m;
limit_req_zone $velo_client_ip zone=velo_admin:10m rate=5r/s;
limit_req_zone $velo_client_ip zone=velo_panel:10m rate=20r/s;
limit_conn_zone $velo_client_ip zone=velo_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;
# Redirects stay relative (nginx itself sits on :8080 behind Caddy, which the browser never sees).
absolute_redirect off;

upstream velo_server {
	server 127.0.0.1:8787;
	keepalive 16;
}

upstream velo_panel {
	server 127.0.0.1:8790;
	keepalive 4;
}

# Shared by every proxied Velo location.
map $http_upgrade $velo_connection {
	default "";
	websocket upgrade;
}

server {
	listen 127.0.0.1:8080 default_server;
	listen 172.18.0.1:8080 default_server;
	server_name _;
	return 444;
}

server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name www.velo-client.com;
	return 301 https://velo-client.com$request_uri;
}

# ---- The website (static, built by velo-site) + the API under /v1 on the same origin ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name velo-client.com;

	root /var/www/velo-client.com;
	index index.html;
	charset utf-8;
	limit_conn velo_conn 64;
	access_log /var/log/nginx/velo-site.access.log;
	error_log /var/log/nginx/velo-site.error.log warn;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 512;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;

	include /etc/nginx/snippets/velo-headers.conf;
	include /etc/nginx/snippets/velo-site-csp.conf;

	# One address per page (SEO): /store.html -> /store, /index -> /.
	if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
		return 301 /$1$2;
	}
	location = /index {
		return 301 /;
	}
	# Old addresses of the legal pages.
	location = /datenschutz { return 301 /privacy; }
	location = /impressum { return 301 /imprint; }

	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		include /etc/nginx/snippets/velo-headers.conf;
		include /etc/nginx/snippets/velo-site-csp.conf;
		try_files $uri $uri.html $uri/ =404;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
		add_header Cache-Control "no-cache";
		include /etc/nginx/snippets/velo-headers.conf;
		include /etc/nginx/snippets/velo-site-csp.conf;
	}

	location ~* \.(?:woff2?)$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include /etc/nginx/snippets/velo-headers.conf;
		access_log off;
		try_files $uri =404;
	}
	location ~* \.(?:css|js|png|jpe?g|webp|avif|gif|svg|ico|mp4|webm)$ {
		add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
		include /etc/nginx/snippets/velo-headers.conf;
		access_log off;
		try_files $uri =404;
	}

	# The API on the same origin (no CORS needed for the web Store).
	location ^~ /v1/ {
		limit_req zone=velo_api burst=80 nodelay;
		client_max_body_size 16m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location = /v1/web/login {
		limit_req zone=velo_login burst=5 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ^~ /v1/admin/ {
		limit_req zone=velo_admin burst=40 nodelay;
		client_max_body_size 64m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_pass http://velo_server;
	}
	# Pages the server renders itself (checkout return, ad page) and ads.txt for the ad network.
	location ~ ^/(store/done|rewards/ad)$ {
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location = /ads.txt {
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
}

# ---- The API host; also client.asteriasmp.net once its DNS points here (pre-0.9.8 clients) ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name api.velo-client.com client.asteriasmp.net;
	limit_conn velo_conn 64;
	access_log /var/log/nginx/velo-api.access.log;
	error_log /var/log/nginx/velo-api.error.log warn;
	include /etc/nginx/snippets/velo-headers.conf;

	location / {
		limit_req zone=velo_api burst=80 nodelay;
		client_max_body_size 16m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location = /v1/web/login {
		limit_req zone=velo_login burst=5 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_server;
	}
	location ^~ /v1/admin/ {
		limit_req zone=velo_admin burst=40 nodelay;
		client_max_body_size 64m;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_pass http://velo_server;
	}
}

# ---- The owner panel ----
server {
	listen 127.0.0.1:8080;
	listen 172.18.0.1:8080;
	server_name panel.velo-client.com;
	access_log /var/log/nginx/velo-panel.access.log;
	error_log /var/log/nginx/velo-panel.error.log warn;
	client_max_body_size 210m;
	include /etc/nginx/snippets/velo-headers.conf;
	add_header X-Robots-Tag "noindex, nofollow" always;

	location = /robots.txt {
		add_header Content-Type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}
	location / {
		limit_req zone=velo_panel burst=60 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_request_buffering off;
		proxy_pass http://velo_panel;
	}
	location = /api/login {
		limit_req zone=velo_login burst=5 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_panel;
	}
	location = /api/challenge {
		limit_req zone=velo_login burst=10 nodelay;
		include /etc/nginx/snippets/velo-proxy.conf;
		proxy_pass http://velo_panel;
	}
}
