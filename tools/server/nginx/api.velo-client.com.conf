# The Velo server (server/, velo-server.service on port 8787): api.velo-client.com.
# certbot --nginx adds the 443 block and certificate.
#
# Moving off client.asteriasmp.net: 0.9.8+ clients and launchers use api.velo-client.com (and follow the move from
# a saved network.json). Older ones still call client.asteriasmp.net - as long as that name exists, point its DNS
# here too and add it to server_name (and to the certbot -d list) so they keep working until everyone has updated.

server {
	listen 80;
	listen [::]:80;
	server_name api.velo-client.com;

	# News images are up to 12 MB (capes 6 MB) - nginx's default limit is 1 MB.
	client_max_body_size 16m;

	location / {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Friends/party live updates are long polls.
		proxy_read_timeout 90s;
	}
}
