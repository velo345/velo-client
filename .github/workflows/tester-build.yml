name: Tester Build

# The Velo Client Tester launcher (owner 2026-11-22): every feature in development, for players with the Discord
# tester role. Push a tag "tester-<version>" (e.g. tester-1.5.1.1) after writing tester/builds/<version>.json.
# Builds on all four runners like the normal launcher, but nothing goes to a GitHub release: every file is uploaded
# privately to the Velo server (server TesterRoutes), where only testers can download it and the Tester launcher
# finds its update.
on:
  push:
    tags:
      - "tester-*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      VELO_SERVER: https://api.velo-client.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Version from the tag
        shell: bash
        run: echo "TESTER_VERSION=${GITHUB_REF_NAME#tester-}" >> "$GITHUB_ENV"

      - name: Build the dev mod jars (everything in development)
        shell: bash
        run: ./gradlew :1.21.1:build :1.21.10:build :1.21.11:build :26.1:build :26.2:build :26.3:build -PveloDev=true -q

      - name: Build the Velo Client Tester launcher
        shell: bash
        run: ./gradlew :launcher:jpackageDist -PveloDev=true -PlauncherVersion="$TESTER_VERSION" -q

      - name: Upload to the Velo server (private)
        shell: bash
        env:
          TOKEN: ${{ secrets.VELO_TESTER_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          cd launcher/build/jpackage-dist
          for f in *; do
            [ -f "$f" ] || continue
            name="${f// /.}"
            echo "Uploading $name ($(du -h "$f" | cut -f1))"
            curl -fsS --retry 3 --retry-all-errors -X POST -H "X-Velo-Tester-Token: $TOKEN" \
              -H "Content-Type: application/octet-stream" --data-binary @"$f" \
              "$VELO_SERVER/v1/admin/tester/file?version=$TESTER_VERSION&name=$name"
            echo
          done

      # Players who use only the mod (another launcher): the tester mod jar for every Minecraft version. Never the add-ons.
      - name: Upload the tester mod jars
        if: runner.os == 'Linux'
        shell: bash
        env:
          TOKEN: ${{ secrets.VELO_TESTER_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          for jar in versions/*/build/libs/velo-client-*-dev+*.jar; do
            case "$jar" in *-sources.jar) continue;; esac
            mc="${jar##*+}"; mc="${mc%.jar}"
            name="velo-client-tester-$TESTER_VERSION+$mc.jar"
            echo "Uploading $name"
            curl -fsS --retry 3 --retry-all-errors -X POST -H "X-Velo-Tester-Token: $TOKEN" \
              -H "Content-Type: application/octet-stream" --data-binary @"$jar" \
              "$VELO_SERVER/v1/admin/tester/file?version=$TESTER_VERSION&name=${name//+/%2B}"
            echo
          done

      - name: Upload the build notes
        if: runner.os == 'Linux'
        shell: bash
        env:
          TOKEN: ${{ secrets.VELO_TESTER_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          notes="tester/builds/$TESTER_VERSION.json"
          if [ ! -f "$notes" ]; then echo "No $notes - writing a minimal one"; echo '{"title":"Tester build","changes":[],"test":[]}' > /tmp/notes.json; notes=/tmp/notes.json; fi
          curl -fsS --retry 3 -X POST -H "X-Velo-Tester-Token: $TOKEN" -H "Content-Type: application/json" \
            --data-binary @"$notes" "$VELO_SERVER/v1/admin/tester/notes?version=$TESTER_VERSION"
