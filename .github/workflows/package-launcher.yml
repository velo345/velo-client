name: Package Launcher

# Builds a single native installer for the Velo Client Launcher on each OS via
# jpackage (see launcher/build.gradle's jpackageDist task) - jpackage can't
# cross-compile, so this has to run on a real instance of each target OS
# rather than all from one machine. Triggered manually (to build/inspect
# without cutting a release) or on a version tag push (also uploads the
# results straight onto that tag's GitHub release).
on:
  workflow_dispatch:
    inputs:
      launcher_version:
        description: "Launcher version for this build (empty = the one in launcher/build.gradle) - e.g. an update-test target"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # .deb for Debian/Ubuntu, .tar.gz (app folder + runtime) for Arch (packaging/aur) and other distros
            asset-glob: launcher/build/jpackage-dist/*.deb launcher/build/jpackage-dist/*.tar.gz
          - os: windows-latest
            asset-glob: launcher/build/jpackage-dist/*.exe
          # macOS: one runner per CPU, since jpackage bundles the JDK that runs it -
          # macos-latest is Apple Silicon (arm64), macos-15-intel is Intel (x64).
          # launcher/build.gradle names the results ...-macos-arm64.dmg / ...-macos-x64.dmg.
          - os: macos-latest
            asset-glob: launcher/build/jpackage-dist/*.dmg
          - os: macos-15-intel
            asset-glob: launcher/build/jpackage-dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"

      # jpackage's --type exe needs WiX v3's candle.exe/light.exe, which
      # windows-latest runners don't ship with by default.
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Build mod jars (all 3 supported Minecraft versions)
        shell: bash
        run: ./gradlew :1.21.1:build :1.21.10:build :1.21.11:build :26.1:build :26.2:build :26.3:build -q

      - name: Build launcher installer
        shell: bash
        run: ./gradlew :launcher:jpackageDist -q ${{ github.event.inputs.launcher_version != '' && format('-PlauncherVersion={0}', github.event.inputs.launcher_version) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: velo-client-launcher-${{ matrix.os }}
          path: launcher/build/jpackage-dist/*
          if-no-files-found: error

      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" ${{ matrix.asset-glob }} --clobber
