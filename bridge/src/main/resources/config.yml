# ─────────────────────────────────────────────────────────────────────────────
#  Velo Bridge - https://dev.velo-client.com
#  Everything here only reaches players using Velo Client. Other players are
#  never affected, and nothing here can kick or ban anyone.
# ─────────────────────────────────────────────────────────────────────────────

server:
  # Shown on everything the server sends ("From <name>"), so players always know
  # a message came from your server and not from Velo Client itself.
  name: "My Server"
  # Accent color for your toasts, countdowns and progress bars (hex).
  color: "#5aa9ff"

# Mod hints. Velo checks the player's mods ON THEIR PC and only shows a warning -
# nothing is enforced and the player can hide it for your server.
mod-rules:
  # Ready-made lists: cheat-clients (Wurst, Meteor, Glazed, LiquidBounce, ...),
  # often-banned (X-Ray, Freecam, Baritone, auto clickers, ...), radar (minimap entity radar).
  forbid-presets: [cheat-clients]
  # Your own. match: id (fabric mod id) | modrinth (project slug or id) | name (part of the mod name / file)
  forbid:
    # - { match: id, value: "freecam", label: "Freecam" }
  # Ready-made recommendations (players see only the ones they DON'T have yet, and can add them with one click
  # in Velo - the game restarts and rejoins): performance, voice-chat, emotes, shaders
  recommend-presets: []
  recommend:
    # - { match: modrinth, value: "simple-voice-chat", label: "Simple Voice Chat" }
  message: "Using these can get you banned here."

# Chat lines for staff (permission velobridge.notify). Everything is quiet by default.
notify:
  # a line for every player who joins with Velo
  on-join: false
  # a line when someone joins with modules you switched off below
  on-disabled-modules: false
  # one console line per Velo join
  log-joins: false
  # a line when someone joins with a mod from your forbid lists (their Velo reports their mod list;
  # always written to the console and to mod-logs/ either way)
  on-detection: false

# Which mods Velo players join with, one line per join in plugins/VeloBridge/mod-logs/<date>.log and
# as "Mods used" in your owner panel. Players can switch the reporting off in Velo (it's on by default).
mod-log:
  enabled: true

# Velo Client modules switched OFF while playing here. Unlike mod hints this IS
# enforced (you decided it, there are no false positives). Players see which
# modules your server turned off. Module ids: https://dev.velo-client.com/modules
disabled-modules:
  # - freelook
  # - minimap-radar

# Server-driven Discord / friends status. Placeholders: %server% %online% %max% %world%
presence:
  enabled: true
  details: "Playing on %server%"
  state: "%online%/%max% online"

# Download your resource pack(s) in the background before players join, so the
# pack prompt finishes instantly. id must be the UUID you use for setResourcePack.
precache-packs:
  # - { id: "7a5d6c1e-0000-0000-0000-000000000001", url: "https://example.com/pack.zip", sha1: "0123456789abcdef0123456789abcdef01234567" }

# Servers players may be transferred to (/velobridge transfer, API). Velo also
# warms up the connection to these so the switch is faster.
transfer-targets:
  # lobby: "lobby.example.com:25565"
  # survival: "survival.example.com"

# World Notes (Velo's floating notes) on your server.
notes:
  enabled: true
  max-per-player: 20
  # Pictures on notes and picture-only notes. false: they aren't shown or placed here.
  images: true
  # Whiteboard notes and drawings on notes. false: they aren't shown or placed here.
  whiteboards: true
  # Areas where nobody can place notes.
  blocked-areas:
    # - { name: "Spawn", world: "world", x1: -100, z1: -100, x2: 100, z2: 100 }
  # Server-wide notes: every Velo player can pin notes everyone here sees (Velo's notes are otherwise only shared
  # with friends). Stored in plugins/VeloBridge/server-notes.json - remove them in /velobridge panel or with
  # /velobridge notes. Staff with velobridge.notes.manage can change and remove any of them in Velo.
  server-wide:
    enabled: false
    # Only in these areas (none = everywhere outside blocked-areas).
    areas:
      # - { name: "Market", world: "world", x1: 100, z1: 100, x2: 200, z2: 200 }
    max-per-player: 5
    # Who may place them ("" = everyone).
    permission: ""
    whiteboards: true

# Tell new Velo players about Velo-only features of your server (once per player).
welcome-toast:
  enabled: false
  title: "Welcome!"
  text: "This server supports Velo Client features."

# Anonymous numbers for the Velo team (Velo players online, Velo versions).
# Lets us list your server as a Velo partner. No player names or UUIDs.
stats: true

# ─── Owner panel ────────────────────────────────────────────────────────────
# /velobridge panel gives you a link to dev.velo-client.com/panel: live numbers (Velo players, versions,
# modules, join times) and every setting of this file. Player names of joins are sent for the
# dashboard; nothing else leaves your server. false: no panel, nothing is sent.
panel:
  enabled: true

# ─── Server menus ───────────────────────────────────────────────────────────
# Velo players get a real Velo window, everyone else a chest menu. Open one with /velomenu <id>,
# its own command, the action "menu:<id>" or the API.
# Actions: command:/spawn | console:/give %player% diamond | menu:<id> | close | message:<text> |
#          server:<bungee server> | transfer:<transfer target> | cutscene:<id> | sound:<id> | music:<id> | music-stop
# Several: "command:/spawn ; close". Input fields: {field-id}. Placeholders: %player% %health% %level% %x% ...
# (+ PlaceholderAPI).
menus:
  # console: actions run as the console - only switch this on if you trust everyone who can edit menus.
  # (The owner panel can never change this one.)
  allow-console-actions: false
  list:
    warps:
      title: "Warps"
      subtitle: "Where to?"
      command: warps
      items:
        - { type: entry, id: spawn, label: "Spawn", detail: "Back to the start", icon: compass, action: "command:/spawn ; close" }
        - { type: divider }
        - { type: input, id: home, label: "Home name", placeholder: "base" }
        - { type: button, id: sethome, label: "Set home", style: primary, action: "command:/sethome {home} ; close" }

