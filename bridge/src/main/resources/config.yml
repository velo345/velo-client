  #     - [0.5, 80, 0.5, 45, 10]
  #     - [20, 85, 30, 120, 20]
# Played for Velo players joining for the first time ("" = none).
on-first-join-cutscene: ""

# ─── Music & sound zones ────────────────────────────────────────────────────
# Fades in when a Velo player walks in, out when they leave. Sound event ids (vanilla or your resource pack).
# Quick setup in game: /vb zone pos1, /vb zone pos2, /vb zone create <id> <sound> [volume]
sound-zones:
  # spawn:
  #   world: world
  #   from: [-50, 0, -50]
  #   to: [50, 320, 50]
  #   sound: "minecraft:music_disc.cat"
  #   volume: 0.8
  #   loop: true
  #   priority: 0
# Music for a whole world when no zone applies.
world-music:
  # world_nether: "minecraft:music.nether.basalt_deltas"

