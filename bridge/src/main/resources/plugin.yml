name: VeloBridge
version: '${version}'
main: net.veloclient.bridge.VeloBridgePlugin
api-version: '1.20'
folia-supported: true
author: Velo Client
website: https://dev.velo-client.com
description: Talk to Velo Client players - mod hints, teammates, waypoints, native UI, transfers and more.
commands:
  velobridge:
    description: Velo Bridge admin commands
    aliases: [vb]
    usage: /velobridge help
    permission: velobridge.admin
permissions:
  velobridge.admin:
    description: Use /velobridge
    default: op
  velobridge.notify:
    description: Get told when a Velo player joins with modules your server disabled or warned about
    default: op
